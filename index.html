<title>Studia AI · studio guidato dai tuoi materiali</title>
<style>
:root{
  --bg:#0A0C12;
  --surface:#101219;
  --surface-2:#151822;
  --surface-3:#1B1F2B;
  --border:rgba(255,255,255,.075);
  --border-2:rgba(255,255,255,.14);
  --text:#E9EBF2;
  --text-2:#A4ACC0;
  --text-3:#6D768C;
  --accent:#6366F1;
  --accent-2:#8B5CF6;
  --accent-soft:rgba(99,102,241,.14);
  --accent-line:rgba(99,102,241,.34);
  --green:#34D399; --green-soft:rgba(52,211,153,.13);
  --amber:#F5B84B; --amber-soft:rgba(245,184,75,.13);
  --red:#F87171; --red-soft:rgba(248,113,113,.13);
  --r-lg:18px; --r-md:14px; --r-sm:10px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(760px 420px at 12% -6%, rgba(99,102,241,.16) 0%, rgba(99,102,241,0) 62%),
    radial-gradient(680px 420px at 96% 2%, rgba(139,92,246,.10) 0%, rgba(139,92,246,0) 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--font);
  font-size:15px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  height:100%;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.02em;line-height:1.25}
p{margin:0}
::-webkit-scrollbar{width:0;height:0}
::selection{background:rgba(99,102,241,.4)}

.app{
  max-width:600px;margin:0 auto;display:flex;flex-direction:column;
  height:100vh;height:100dvh;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;scroll-behavior:smooth;
  padding-bottom:calc(88px + env(safe-area-inset-bottom));
}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;flex:0 0 auto;
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;
  background:linear-gradient(180deg,rgba(10,12,18,.96) 0%,rgba(10,12,18,.82) 68%,rgba(10,12,18,0) 100%);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(150deg,var(--accent),var(--accent-2));
  box-shadow:0 1px 0 rgba(255,255,255,.28) inset,0 6px 14px -8px rgba(99,102,241,.9);
}
.brand .mark svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round}
.brand-title{font-size:15px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.brand-sub{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin-top:2px}
.top .grow{flex:1}
.iconbtn{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);cursor:pointer;transition:.16s;
}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:active{transform:scale(.94);background:var(--surface-3);color:var(--text)}

/* ---------- layout ---------- */
main{flex:1;padding:6px 16px 26px;animation:fade .26s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.038),rgba(255,255,255,.012));
  border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;
}
.card.tight{padding:14px}
.card.flat{background:rgba(255,255,255,.018)}
.card.lined{padding:4px 16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.mut{color:var(--text-2)}
.dim{color:var(--text-3)}
.tiny{font-size:11.5px;line-height:1.45;letter-spacing:.005em}
.sm{font-size:13.4px;line-height:1.5}
.h1{font-size:26px;font-weight:700;letter-spacing:-.035em}
.h2{font-size:19px;font-weight:650;letter-spacing:-.025em}
.h3{font-size:14.6px;font-weight:640;letter-spacing:-.012em}
.micro{font-size:10.5px;font-weight:700;letter-spacing:.085em;text-transform:uppercase;color:var(--text-3)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec-title h2{font-size:12px;font-weight:700;letter-spacing:.085em;text-transform:uppercase;color:var(--text-3)}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:0;border-radius:12px;padding:13px 16px;font-size:14.5px;font-weight:600;letter-spacing:-.01em;
  background:var(--accent);color:#fff;cursor:pointer;transition:transform .14s,filter .14s,background .14s;
  box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 8px 18px -12px rgba(99,102,241,1);
}
.btn:active{transform:scale(.975)}
.btn.wide{width:100%}
.btn.ghost{background:var(--surface-2);border:1px solid var(--border);color:var(--text);box-shadow:none}
.btn.ghost:active{background:var(--surface-3)}
.btn.soft{background:var(--accent-soft);border:1px solid var(--accent-line);color:#C9CBFF;box-shadow:none}
.btn.ok{background:var(--green);box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 8px 18px -14px rgba(52,211,153,1);color:#04231A}
.btn.bad{background:var(--red-soft);border:1px solid rgba(248,113,113,.34);color:#FFC5C5;box-shadow:none}
.btn.warn{background:var(--amber-soft);border:1px solid rgba(245,184,75,.34);color:#FFE0A8;box-shadow:none}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:10px}
.btn.xs{padding:7px 11px;font-size:12px;border-radius:9px;font-weight:600}
.btn:disabled{opacity:.45;filter:saturate(.3)}
.link{background:none;border:0;color:#A5A9FF;font-size:12.5px;font-weight:600;padding:2px;cursor:pointer;letter-spacing:-.005em}

/* ---------- hero / data ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:var(--r-lg);padding:18px;margin-bottom:12px;
  background:
    radial-gradient(130% 130% at 0% 0%, rgba(99,102,241,.30) 0%, rgba(99,102,241,0) 58%),
    linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  border:1px solid var(--border-2);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset;
}
.hero.alt{background:radial-gradient(130% 130% at 100% 0%, rgba(245,184,75,.16) 0%, rgba(245,184,75,0) 60%),linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012))}
.ring{position:relative;width:72px;height:72px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg);display:block}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:-.03em}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;
  background:rgba(255,255,255,.055);border:1px solid var(--border);font-size:11px;font-weight:650;
  color:#CFD5E6;letter-spacing:.005em;white-space:nowrap;
}
.pill.ok{background:var(--green-soft);border-color:rgba(52,211,153,.28);color:#9BE9C9}
.pill.warn{background:var(--amber-soft);border-color:rgba(245,184,75,.28);color:#F8D79A}
.pill.acc{background:var(--accent-soft);border-color:var(--accent-line);color:#C4C6FF}
.pill.bad{background:var(--red-soft);border-color:rgba(248,113,113,.28);color:#FFB9B9}
.tile{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 10px;text-align:center}
.tile b{display:block;font-size:19px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile span{display:block;margin-top:2px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}

/* ---------- lists ---------- */
.item{
  display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--border);margin-bottom:8px;
}
.item:last-child{margin-bottom:0}
.item.plain{background:transparent;border:0;border-bottom:1px solid var(--border);border-radius:0;margin-bottom:0;padding:14px 2px}
.item.plain:last-child{border-bottom:0}
.avatar{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;
  flex:0 0 auto;color:#0B0D14;letter-spacing:-.02em;
}
.avatar.lg{width:44px;height:44px;border-radius:12px;font-size:16px}
.avatar.sm{width:30px;height:30px;border-radius:9px;font-size:12px}
.check{
  width:26px;height:26px;border-radius:8px;border:1.5px solid rgba(255,255,255,.22);
  display:grid;place-items:center;background:transparent;cursor:pointer;flex:0 0 auto;transition:.16s;
}
.check.on{background:var(--green);border-color:transparent}
.check.on svg{display:block}
.check svg{display:none}

/* ---------- progress ---------- */
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.075);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .45s cubic-bezier(.4,0,.2,1)}
.bar.thin{height:5px}

/* ---------- week chart ---------- */
.week{display:flex;align-items:flex-end;gap:7px;height:64px;margin-top:12px}
.week .col-b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .stem{width:100%;border-radius:5px 5px 3px 3px;background:rgba(255,255,255,.09);min-height:5px;transition:height .4s}
.week .stem.on{background:linear-gradient(180deg,var(--accent-2),var(--accent))}
.week .d{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}

/* ---------- chips ---------- */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  padding:8px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);
  font-size:12.5px;font-weight:600;color:#C4CBE0;cursor:pointer;transition:.14s;
}
.chip:active{transform:scale(.97);background:var(--surface-3)}
.chip.on{border-color:var(--accent-line);background:var(--accent-soft);color:#C9CBFF}

/* ---------- inputs ---------- */
.drop{
  border:1.5px dashed rgba(99,102,241,.38);border-radius:var(--r-lg);padding:24px 16px;text-align:center;
  background:rgba(99,102,241,.055);cursor:pointer;transition:.16s;
}
.drop:active{background:rgba(99,102,241,.11)}
.drop .big{
  width:44px;height:44px;margin:0 auto 10px;border-radius:12px;display:grid;place-items:center;
  background:var(--accent-soft);border:1px solid var(--accent-line);
}
.drop .big svg{width:21px;height:21px;stroke:#C0C2FF;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.formats{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.fmt{font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.07);color:var(--text-2)}
textarea,input[type=text],input[type=number],input[type=date],input[type=password],input[type=url],select{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;
  padding:12px 13px;font-size:14.5px;outline:none;transition:.14s;color:var(--text);
}
textarea:focus,input:focus,select:focus{border-color:rgba(99,102,241,.55);background:rgba(99,102,241,.07);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
textarea{min-height:110px;resize:vertical;line-height:1.55}
label.fl{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin:14px 2px 6px}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.75)}

/* ---------- sheet ---------- */
.sheet-bg{
  position:fixed;inset:0;z-index:80;touch-action:none;background:rgba(4,6,12,.72);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease;
}
.sheet{
  width:100%;max-width:600px;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;border-radius:22px 22px 0 0;
  background:linear-gradient(180deg,#141823,#0C0F16);border:1px solid var(--border-2);border-bottom:0;
  padding:6px 18px calc(22px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.9,.3,1);
  box-shadow:0 -20px 50px -20px #000;
}
@keyframes up{from{transform:translateY(34px);opacity:.5}to{transform:none;opacity:1}}
.handle{width:36px;height:4px;border-radius:9px;background:rgba(255,255,255,.18);margin:10px auto 16px}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;
  padding:8px 8px calc(6px + env(safe-area-inset-bottom));
  background:rgba(10,12,18,.92);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  border-top:1px solid var(--border);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;
  padding:6px 1px 5px;color:#69728a;font-size:9.4px;font-weight:650;letter-spacing:.01em;cursor:pointer;
  transition:.16s;border-radius:10px;position:relative;min-width:0;
}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:#D6D9FF}
.tab.active svg{stroke:#9EA0FF}
.tab.active:after{content:"";position:absolute;top:0;width:16px;height:2px;border-radius:2px;background:var(--accent)}

/* ---------- quiz ---------- */
.qopt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;margin-bottom:8px;
  border-radius:12px;border:1px solid var(--border);background:var(--surface-2);
  font-size:14.4px;font-weight:550;line-height:1.4;cursor:pointer;transition:.14s;color:var(--text);
  letter-spacing:-.005em;
}
.qopt:active{transform:scale(.99)}
.qopt .k{
  width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.07);display:grid;place-items:center;
  font-size:11.5px;font-weight:700;flex:0 0 auto;color:var(--text-2);
}
.qopt.right{border-color:rgba(52,211,153,.6);background:var(--green-soft)}
.qopt.right .k{background:rgba(52,211,153,.28);color:#CFFAEA}
.qopt.wrong{border-color:rgba(248,113,113,.6);background:var(--red-soft)}
.qopt.wrong .k{background:rgba(248,113,113,.28);color:#FFD6D6}
.qopt.dim{opacity:.45}
.qopt:disabled{cursor:default}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:9px;padding-bottom:4px}
.msg{max-width:89%;padding:11px 13px;border-radius:15px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;letter-spacing:-.005em}
.msg.ai{background:var(--surface-2);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:5px;color:#DDE2EF}
.msg.me{background:linear-gradient(160deg,var(--accent),#5B5FE0);align-self:flex-end;border-bottom-right-radius:5px;color:#fff;box-shadow:0 6px 16px -12px rgba(99,102,241,1)}
.chatbar{
  position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));z-index:5;
  background:linear-gradient(180deg,rgba(10,12,18,0),rgba(10,12,18,.94) 42%);
  padding:16px 0 6px;display:flex;gap:8px;align-items:flex-end;
}
.chatbar textarea{min-height:46px;max-height:120px;padding:13px;border-radius:13px}
.send{
  width:46px;height:46px;border-radius:13px;border:0;flex:0 0 auto;display:grid;place-items:center;
  background:var(--accent);cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 8px 18px -12px rgba(99,102,241,1);
}
.send svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

/* ---------- badges & misc ---------- */
.badge{
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 6px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--border);text-align:center;font-size:10.5px;
  font-weight:650;color:var(--text-3);line-height:1.25;
}
.badge .e{font-size:19px;filter:grayscale(1);opacity:.32}
.badge.on{background:var(--amber-soft);border-color:rgba(245,184,75,.28);color:#F8D79A}
.badge.on .e{filter:none;opacity:1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{text-align:center;padding:36px 18px;color:var(--text-2)}
.empty .big{font-size:34px;margin-bottom:12px;opacity:.8}
.timer-num{font-size:42px;font-weight:700;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
/* iOS: evita lo zoom automatico dei campi (font >= 16px) e gestisce l'altezza */
@media (max-width: 640px){

<script>
/* ---- avvio PWA: service worker + deep link ---- */

/* ---------------- costanti ---------------- */
const DB_KEY = 'studiaai.v1';
const COLORS = ['#7c5cff','#22d3ee','#34d399','#fbbf24','#fb7185','#a78bfa','#38bdf8','#f472b6'];
const STOP = new Set(('il lo la i gli le un uno una di a da in con su per tra fra e ed o od ma che non piu piú anche come dove quando quale quali questo questa questi queste quello quella essere sono sei siamo siete erano era stato stata stati state hanno ha hai ho abbiamo avete del della dei delle dello degli al alla ai alle allo agli nel nella nei nelle nello negli sul sulla sui sulle dal dalla dai dalle dei sia sono cio cioe quindi perche poiché perció così cosi molto poco tutto tutti tutte ogni altro altra altri altre dopo prima durante senza sopra sotto tra mentre cui loro esso essa suoi sue suo sua nostro vostra stesso stessa solo ancora gia già sempre mai se ne vi ci mi ti si lo').split(/\s+/).filter(Boolean));

/* ---------------- stato ---------------- */
const DEF = () => ({
  subjects: [],   // {id,name,color,text,createdAt,source}
  plan: [],       // {id,subjectId,topic,type,date,minutes,done,doneAt}
  cards: [],      // {id,subjectId,topic,front,back,ease,ivl,due,reps}
  notes: [],      // {id,subjectId,topic,text,at}
  chat: [],       // {role,content}
  stats: { xp:0, streak:0, lastDay:null, days:[], challengeBest:0, challengeCount:0, correct:0, wrong:0, sessions:0, dailyDay:null, matches:0, survival:0 },
  settings: { endpoint:'https://api.openai.com/v1/chat/completions', key:'', model:'gpt-4o-mini', driveClientId:'', driveApiKey:'', web:true },
  seed: false
});

let db = loadDB();
let ui = { tab:'oggi', quiz:null, session:null, sheet:null, timer:null, feynman:null, thinking:false, lastSubject:null };

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      const base = DEF();
      for(const k of Object.keys(base)){
        if(parsed[k] === undefined) parsed[k] = base[k];
        else if(typeof base[k]==='object' && base[k] && !Array.isArray(base[k])) parsed[k] = Object.assign(base[k], parsed[k]);
      }
      return parsed;
    }
  }catch(e){ console.warn('load fail', e); }
  return DEF();
}
function saveDB(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){} }

/* ---------------- utilità ---------------- */
const uid = () => Math.random().toString(36).slice(2,9);
const esc = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function linkify(t){ return esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a class="lnk" href="$1" target="_blank" rel="noopener noreferrer">$1</a>'); }
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
const clamp = (n,a,b) => Math.max(a, Math.min(b, n));
const iso = d => { const x = new Date(d); return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const today = () => iso(new Date());
function addDays(isoStr, n){ const d = new Date(isoStr+'T12:00:00'); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a,b){ return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/86400000); }
const DOW = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
const MON = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
function fmtDay(isoStr){
  if(!isoStr) return '';
  const d = new Date(isoStr+'T12:00:00');
  if(isoStr === today()) return 'Oggi';
  if(isoStr === addDays(today(),1)) return 'Domani';
  if(isoStr === addDays(today(),-1)) return 'Ieri';
  return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];
}
function fmtLong(isoStr){ const d = new Date(isoStr+'T12:00:00'); return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear(); }
function toast(msg, ms=2100){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), ms);
}
function appEl(){ return document.querySelector('.app'); }
function scrollAppTop(smooth){
  const el = appEl();
  if(el) el.scrollTo({ top:0, behavior: smooth === false ? 'auto' : 'smooth' });
  try{ window.scrollTo({ top:0, behavior:'smooth' }); }catch(e){}
}
function scrollAppBottom(){
  const el = appEl();
  if(el) el.scrollTo({ top: el.scrollHeight, behavior:'smooth' });
}
function shuffle(a){ const r = a.slice(); for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]] = [r[j],r[i]]; } return r; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
const level = xp => Math.floor(xp/120)+1;
const levelProg = xp => (xp%120)/120;

function addXP(n, why){
  db.stats.xp += n;
  touchDay();
  if(why) toast('+'+n+' XP · '+why);
  saveDB();
}
function touchDay(){
  const t = today();
  if(db.stats.lastDay === t) return;
  if(db.stats.lastDay && diffDays(db.stats.lastDay, t) === 1) db.stats.streak = (db.stats.streak||0)+1;
  else if(db.stats.lastDay && diffDays(db.stats.lastDay, t) > 1) db.stats.streak = 1;
  else if(!db.stats.lastDay) db.stats.streak = 1;
  db.stats.lastDay = t;
  if(!db.stats.days.includes(t)) db.stats.days.push(t);
  if(db.stats.days.length > 400) db.stats.days = db.stats.days.slice(-400);
}

/* =========================================================================
   MOTORE DI TESTO (funziona 100% offline)
   ========================================================================= */
function cleanText(t){
  return String(t||'').replace(/\r/g,'').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
}
function sentences(t){
  return cleanText(t)
    .split(/(?<=[.!?])\s+|\n+/)
    .map(s => s.replace(/\s+/g,' ').trim())
    .filter(s => s.length > 30 && /[a-zàèéìòù]/i.test(s));
}
function tokenize(t){ return (String(t).toLowerCase().match(/[a-zàèéìòùüç]{2,}/gi)||[]); }
function keyTerms(t, n=30){
  const m = new Map();
  tokenize(t).forEach(w => { if(w.length < 5 || STOP.has(w)) return; m.set(w, (m.get(w)||0)+1); });
  return [...m.entries()].sort((a,b)=> b[1]-a[1] || b[0].length-a[0].length).slice(0,n).map(e=>e[0]);
}
function paragraphs(t){
  return cleanText(t).split(/\n\s*\n/).map(p=>p.replace(/\s+/g,' ').trim()).filter(p=>p.length>50);
}

/* Estrae gli argomenti: prima prova con titoli/elenchi, poi con i blocchi di testo */
function extractTopics(text, max=12){
  const t = cleanText(text);
  const lines = t.split('\n').map(l=>l.trim()).filter(Boolean);
  let topics = [];
  lines.forEach(l=>{
    const isHead = /^#{1,6}\s+/.test(l) || /^(\d+[.)]|[•\-*])\s+/.test(l) ||
      (l.length>3 && l.length<72 && !/[.!?,;]$/.test(l) && /[a-zàèéìòù]{3,}/i.test(l));
    if(isHead){
      const clean = l.replace(/^#{1,6}\s+/,'').replace(/^(\d+[.)]|[•\-*])\s+/,'').replace(/^[:\-–]\s*/,'').trim();
      if(clean.length>3) topics.push(clean);
    }
  });
  topics = [...new Set(topics.map(x=>x.replace(/\s+/g,' ')))].filter(x=>x.length<90);

  if(topics.length < 3){
    const sents = sentences(t);
    const target = Math.min(max, Math.max(3, Math.ceil(sents.length/4)));
    const size = Math.max(1, Math.ceil(sents.length/target));
    topics = [];
    for(let i=0;i<sents.length;i+=size){
      const part = sents.slice(i, i+size).join(' ');
      const kt = keyTerms(part,1)[0];
      topics.push(kt ? cap(kt) : 'Blocco '+(topics.length+1));
    }
  }
  return topics.slice(0, max);
}

/* Cerca il passaggio del materiale più vicino alla domanda */
function bestPassage(text, query){
  const qTokens = new Set(tokenize(query).filter(w=>w.length>3 && !STOP.has(w)));
  const blocks = [...paragraphs(text), ...sentences(text)];
  let best = null, bestScore = 0;
  blocks.forEach(b => {
    const bt = tokenize(b);
    let score = 0;
    qTokens.forEach(w => { if(bt.includes(w)) score += 2; if(b.toLowerCase().includes(w)) score += 1; });
    score = score / Math.sqrt(bt.length/20 + 1);
    if(score > bestScore){ bestScore = score; best = b; }
  });
  return bestScore >= 2 ? best : null;
}

function summarize(text, maxSents=3){
  const sents = sentences(text);
  if(!sents.length) return cleanText(text).slice(0,300);
  const freq = new Map();
  tokenize(text).forEach(w=>{ if(w.length>4 && !STOP.has(w)) freq.set(w,(freq.get(w)||0)+1); });
  const scored = sents.map((s,i)=>{
    let sc = 0;
    tokenize(s).forEach(w=> sc += freq.get(w)||0);
    return { s, sc: sc / Math.sqrt(s.length/40 + 1) - i*0.4 };
  });
  return scored.sort((a,b)=>b.sc-a.sc).slice(0,maxSents).map(x=>x.s).join(' ');
}

/* =========================================================================
   GENERAZIONE QUIZ (cloze + vero/falso) dal materiale caricato
   ========================================================================= */
const GENERIC = new Set(('insieme grazie soprattutto principalmente direttamente particolarmente praticamente semplicemente attenzione importante possibile diversi diverse varie vario stessa stesso altro altra cosa cose fatto volta volte modo parte casi caso').split(/\s+/));

function usableTerm(t){
  if(!t || t.length < 5) return false;
  if(/mente$/.test(t)) return false;
  if(/(ando|endo|are|ere|ire|ato|ata|ati|ate|ito|ita|iti|ite|uto|uta|ano|ono|iamo|ete)$/.test(t)) return false;
  if(GENERIC.has(t)) return false;
  return /^[a-zàèéìòùü]+$/.test(t);
}
/* sceglie il concetto più "saliente" presente nella frase */
function bestTermIn(sent, candidates, allTerms){
  const low = sent.toLowerCase();
  const rank = w => { const i = allTerms.indexOf(w); return i < 0 ? 999 : i; };
  const found = candidates.filter(w => usableTerm(w) && low.includes(w));
  if(!found.length) return null;
  found.sort((a,b) => rank(a) - rank(b) || b.length - a.length);
  return found[0];
}
function trimSentence(sent, idx, len){
  if(sent.length <= 240) return sent;
  const from = Math.max(0, idx - 90);
  const to = Math.min(sent.length, idx + len + 120);
  return (from > 0 ? '…' : '') + sent.slice(from, to).trim() + (to < sent.length ? '…' : '');
}

function makeQuestion(sent, candidates, allTerms){
  const term = bestTermIn(sent, candidates, allTerms);
  if(!term) return null;
  const idx = sent.toLowerCase().indexOf(term);
  if(idx < 0) return null;
  const shown = sent.slice(idx, idx + term.length);
  const core = trimSentence(sent, idx, term.length);
  const coreIdx = sent.length > 240 ? core.toLowerCase().indexOf(shown.toLowerCase()) : idx;
  if(coreIdx < 0) return null;
  const blanked = core.slice(0, coreIdx) + '________' + core.slice(coreIdx + shown.length);
  const low = sent.toLowerCase();
  const distractors = shuffle(allTerms.filter(t =>
    t !== term && usableTerm(t) && !low.includes(t) && Math.abs(t.length - term.length) <= 5
  )).slice(0,3);
  if(distractors.length < 3) return null;
  const opts = shuffle([term, ...distractors]);
  return {
    type:'mc',
    q:'Completa: “' + blanked + '”',
    options: opts.map(o => (o === term ? cap(shown) : cap(o))),
    answer: opts.indexOf(term),
    why: sent,
    term: cap(term)
  };
}

const VERBS = /\b(è|sono|era|erano|avviene|avvengono|richiede|richiedono|produce|producono|consuma|consumano|dipende|dipendono|forma|formano|trasforma|trasformano|assorbe|assorbono|libera|liberano|contiene|contengono|permette|permettono|significa|si svolge|si svolgono|si trova|si trovano|serve|servono|viene|vengono|deve|devono|può|possono)\b/;

function makeTrueFalse(sent, candidates, allTerms){
  const isTrue = Math.random() < 0.5;
  if(isTrue){
    return { type:'tf', q: sent.trim(), options:['Vero','Falso'], answer:0,
             why:'Esatto: la frase è fedele al materiale.', term:null };
  }
  const m = sent.match(VERBS);
  if(!m) return null;
  const i = sent.indexOf(m[0]);
  if(i < 0) return null;
  const negated = sent.slice(0,i) + 'non ' + sent.slice(i);
  const term = bestTermIn(sent, candidates, allTerms);
  return {
    type:'tf',
    q: negated.trim(),
    options:['Vero','Falso'],
    answer:1,
    why:'La versione corretta è: ' + sent.trim(),
    term: term ? cap(term) : null
  };
}

/* genera n domande dal materiale caricato — 5 formati diversi */
function snippetOf(s, max=24){
  const w = String(s).split(' ');
  return w.length > max ? w.slice(0, max).join(' ') + '…' : String(s);
}
function makeDefinitionQuestion(sent, candidates, allTerms, pool){
  const term = bestTermIn(sent, candidates, allTerms);
  if(!term) return null;
  const others = shuffle(pool.filter(x => x !== sent && !x.toLowerCase().includes(term))).slice(0,3);
  if(others.length < 3) return null;
  const items = shuffle([{ t:sent, ok:true }, ...others.map(o => ({ t:o, ok:false }))]);
  return {
    type:'def',
    q:'Quale affermazione riguarda “' + cap(term) + '”?',
    options: items.map(i => snippetOf(i.t)),
    answer: items.findIndex(i => i.ok),
    why:'Nel tuo materiale: ' + sent,
    term: cap(term)
  };
}
function makeOddQuestion(pool, allTerms, used){
  const cands = pool.filter(s => s.split(' ').length >= 10 && !used.has(s));
  if(!cands.length) return null;
  const sent = pick(cands);
  const inside = keyTerms(sent, 10).filter(t => usableTerm(t) && allTerms.includes(t)).slice(0,3);
  if(inside.length < 3) return null;
  const intruder = pick(allTerms.filter(t => usableTerm(t) && !sent.toLowerCase().includes(t) && !inside.includes(t)));
  if(!intruder) return null;
  const opts = shuffle([...inside, intruder]).map(t => cap(t));
  return {
    type:'odd',
    q:'Tre di questi termini appartengono allo stesso passaggio del tuo materiale: qual è l\'intruso?',
    options: opts,
    answer: opts.indexOf(cap(intruder)),
    why:'Gli altri erano collegati: ' + inside.map(cap).join(' · ') + '. Nel materiale: ' + sent,
    term: cap(intruder),
    _sent: sent
  };
}
function makeOpenQuestion(sent, candidates, allTerms){
  const term = bestTermIn(sent, candidates, allTerms);
  if(!term) return null;
  return {
    type:'open',
    q:'Spiega a parole tue: “' + cap(term) + '”.',
    options:[], answer:-1, open:true,
    why:'Riferimento nel materiale: ' + sent,
    term: cap(term)
  };
}
function buildQuestions(subjectIds, n=5){
  const subs = db.subjects.filter(s => !subjectIds || !subjectIds.length || subjectIds.includes(s.id));
  const corpus = subs.map(s=>s.text).join('\n\n');
  const allTerms = keyTerms(corpus, 60);
  let sents = sentences(corpus).filter(s => s.split(' ').length >= 8);
  if(sents.length < 3) sents = sentences(corpus).filter(s => s.length >= 25);
  if(sents.length < 2 || allTerms.length < 6) return [];
  const pool = sentences(corpus);
  const qs = [];
  const used = new Set();
  const usedTerms = new Set();
  let guard = 0;
  const recipe = () => {
    const r = Math.random();
    if(r < 0.34) return 'mc';
    if(r < 0.50) return 'tf';
    if(r < 0.70) return 'def';
    if(r < 0.86) return 'odd';
    return 'open';
  };
  while(qs.length < n && guard++ < n*24){
    const sent = pick(sents);
    if(used.has(sent)) continue;
    const localTerms = keyTerms(sent, 8).filter(t => usableTerm(t));
    const kind = recipe();
    let q = null;
    if(kind === 'mc') q = makeQuestion(sent, localTerms, allTerms);
    else if(kind === 'tf') q = makeTrueFalse(sent, localTerms, allTerms);
    else if(kind === 'def') q = makeDefinitionQuestion(sent, localTerms, allTerms, pool);
    else if(kind === 'odd') q = makeOddQuestion(pool, allTerms, used);
    else q = makeOpenQuestion(sent, localTerms, allTerms);
    if(!q) continue;
    if(q.term){
      if(usedTerms.has(q.term)) continue;
      usedTerms.add(q.term);
    }
    used.add(sent);
    if(q._sent) used.add(q._sent);
    qs.push(q);
  }
  return qs;
}

   ========================================================================= */
const SESSION_META = {
  studio:{ label:'Studio attivo', icon:'📖', minutes:30 },
  richiamo:{ label:'Richiamo attivo', icon:'🔁', minutes:15 },
  sfida:{ label:'Sfida a quiz', icon:'⚡', minutes:10 },
  verifica:{ label:'Verifica finale', icon:'🏁', minutes:30 }
};

function buildPlan(subjectId, { deadline, minutesPerDay=60 }={}){
  const s = db.subjects.find(x=>x.id===subjectId);
  if(!s) return 0;
  const topics = extractTopics(s.text, 14);
  if(!topics.length) return 0;

  const start = today();
  const roughDays = Math.max(3, Math.ceil(topics.length * 2.2));
  const end = (deadline && deadline > start) ? deadline : addDays(start, roughDays);
  const availDays = Math.max(1, diffDays(start, end) + 1);
  const studiesPerDay = Math.max(1, Math.ceil(topics.length / availDays));
  const capacity = studiesPerDay + 2;

  const load = {};
  const place = (pref) => {
    let d = pref;
    let guard = 0;
    while((load[d] || 0) >= capacity && guard++ < 120) d++;
    load[d] = (load[d] || 0) + 1;
    return d;
  };

  const tasks = [];
  topics.forEach((t, i) => {
    const studyDay = Math.floor(i / studiesPerDay);
    tasks.push({ topic:t, type:'studio', day: place(studyDay) });
    if(i < topics.length - 1) tasks.push({ topic:t, type:'richiamo', day: place(studyDay + 1) });
    if(i % 3 === 2) tasks.push({ topic:t, type:'sfida', day: place(studyDay + 2) });
  });
  tasks.push({ topic:'Ripasso generale: ' + s.name, type:'verifica', day: place(availDays - 1) });

  db.plan = db.plan.filter(p => p.subjectId !== subjectId);
  tasks.forEach(t => {
    const meta = SESSION_META[t.type];
    db.plan.push({
      id: uid(), subjectId: subjectId, topic: t.topic, type: t.type,
      date: addDays(start, t.day), minutes: meta.minutes, done: false
    });
  });
  db.plan.sort((a,b)=> a.date.localeCompare(b.date));
  saveDB();
  return tasks.length;
}

function planFor(subjectId){ return db.plan.filter(p=>p.subjectId===subjectId).sort((a,b)=>a.date.localeCompare(b.date)); }
function sessionsOn(date){
  return db.plan.filter(p=>p.date===date)
    .sort((a,b)=> (a.done?1:0)-(b.done?1:0) || a.minutes-b.minutes);
}
function planProgress(subjectId){
  const p = planFor(subjectId);
  if(!p.length) return { done:0, total:0, pct:0 };
  const done = p.filter(x=>x.done).length;
  return { done, total:p.length, pct: Math.round(done/p.length*100) };
}

function buildCards(subjectId){
  const s = db.subjects.find(x=>x.id===subjectId);
  if(!s) return 0;
  const topics = extractTopics(s.text, 14);
  const sents = sentences(s.text);
  let created = 0;
  topics.forEach((topic,i)=>{
    const kt = tokenize(topic).filter(w=>!STOP.has(w) && w.length>3);
    const related = sents.filter(x => {
      const lx = x.toLowerCase();
      return kt.some(w => lx.includes(w)) || lx.includes(topic.toLowerCase().slice(0,14));
    });
    const back = related.length
      ? summarize(related.join(' '), 2)
      : summarize(sents[i] || s.text, 2);
    if(!back) return;
    if(db.cards.some(c => c.subjectId===subjectId && c.front===topic)) return;
    db.cards.push({
      id: uid(), subjectId: subjectId, topic: topic,
      front: topic, back: back.slice(0,420),
      ease: 2.5, ivl: 0, due: today(), reps: 0
    });
    created++;
  });
  saveDB();
  return created;
}
function dueCards(subjectId){
  const t = today();
  return db.cards.filter(c => (!subjectId || c.subjectId===subjectId) && c.due <= t);
}
function reviewCard(id, ok){
  const c = db.cards.find(x=>x.id===id);
  if(!c) return;
  if(ok){
    c.reps++;
    c.ivl = c.reps === 1 ? 1 : c.reps === 2 ? 3 : Math.round(c.ivl * c.ease);
    c.ease = Math.min(3.2, c.ease + 0.06);
  }else{
    c.reps = 0; c.ivl = 0;
    c.ease = Math.max(1.5, c.ease - 0.22);
  }
  c.due = addDays(today(), Math.max(0, c.ivl));
  saveDB();
}

function parseCardLines(text){
  const out = [];
  String(text || '').split(/\n+/).forEach(line => {
    const l = line.trim().replace(/^[-*•]\s*/, '');
    if(l.length < 3) return;
    let parts = l.split(/\s*[|\t]\s*/);
    if(parts.length < 2) parts = l.split(/\s*(?:=>|→)\s*/);
    if(parts.length < 2) parts = l.split(/\s+[–—]\s+/);
    if(parts.length < 2) parts = l.split(/\s+-\s+/);
    if(parts.length < 2) parts = l.split(/\s*;\s*/);
    if(parts.length < 2) return;
    const front = parts[0].trim();
    const back = parts.slice(1).join(' — ').trim();
    if(front.length > 1 && back.length > 1) out.push({ front, back });
  });
  return out.slice(0, 300);
}

const STOPW = new Set('il lo la i gli le un una uno di a da in con su per tra fra e o ma che chi cui non più meno come cosa quando dove perché anche se del della dei delle degli al alla alle agli nel nella nei nelle sul sulla sui sulle è sono essere ha hanno si no tra'.split(' '));
function wTokens(t){
  return (String(t||'').toLowerCase().match(/[a-zàèéìòù0-9']{3,}/g) || []).filter(w => !STOPW.has(w));
}
function stripTags(s){ return String(s||'').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim(); }
function domainOf(u){
  try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return 'web'; }
}
function jget(u, ms){
  const ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const to = setTimeout(()=>{ try{ ctl && ctl.abort(); }catch(e){} }, ms || 7000);
  return fetch(u, { signal: ctl ? ctl.signal : undefined })
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .finally(()=> clearTimeout(to));
}

async function srcWikipedia(q, lang){
  const api = `https://${lang}.wikipedia.org/w/api.php`;
  const url = `${api}?action=query&format=json&formatversion=2&origin=*&generator=search`
    + `&gsrsearch=${encodeURIComponent(q)}&gsrlimit=3`
    + `&prop=extracts|info&inprop=url&exintro=1&explaintext=1&exsentences=6`;
  let d = null;
  try{ d = await jget(url, 8000); }
  catch(e){ await new Promise(r=>setTimeout(r,400)); try{ d = await jget(url, 8000); }catch(e2){ return []; } }
  const raw = (d && d.query && d.query.pages) || [];
  const pages = Array.isArray(raw) ? raw : Object.keys(raw).map(k => raw[k]);
  return pages.map(p => ({
    source: 'Wikipedia ' + lang.toUpperCase(),
    title: p.title || 'Voce',
    url: p.fullurl || (p.content_urls && p.content_urls.desktop && p.content_urls.desktop.page) ||
         `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(String(p.title||'').replace(/ /g,'_'))}`,
    snippet: stripTags(p.extract || p.snippet || '')
  })).filter(x => x.snippet.length >= 40).slice(0,3);
}

async function srcDDG(q){
  const d = await jget(`https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1&skip_disambig=1`, 7000);
  const out = [];
  const push = (abs, url, src) => {
    const t = stripTags(abs);
    if(t && t.length > 40 && url) out.push({ source: src || 'DuckDuckGo', title: (d.Heading || 'Risposta immediata'), url, snippet: t });
  };
  if(d && d.AbstractText) push(d.AbstractText, d.AbstractURL, d.AbstractSource || 'DuckDuckGo');
  if(d && d.Definition) push(d.Definition, d.DefinitionURL, 'Definizione');
  ((d && d.RelatedTopics) || []).slice(0,3).forEach(rt => {
    if(rt && rt.Text && rt.FirstURL) push(rt.Text, rt.FirstURL, 'DuckDuckGo');
    ((rt && rt.Topics) || []).slice(0,2).forEach(x => { if(x && x.Text && x.FirstURL) push(x.Text, x.FirstURL, 'DuckDuckGo'); });
  });
  return out.slice(0,3);
}

async function srcCrossref(q){
  const d = await jget(`https://api.crossref.org/works?query=${encodeURIComponent(q)}&rows=4&select=title,URL,abstract,DOI`, 7000);
  const items = (d && d.message && d.message.items) || [];
  const qt = wTokens(q);
  return items.map(it => ({
    source: 'Studio',
    title: (it.title && it.title[0]) || 'Articolo',
    url: it.URL || (it.DOI ? 'https://doi.org/'+it.DOI : ''),
    snippet: stripTags(it.abstract || '')
  })).filter(x => {
    if(!x.url || x.snippet.length < 90) return false;
    const tt = wTokens(x.title + ' ' + x.snippet.slice(0,400));
    return tt.some(w => qt.indexOf(w) >= 0);
  }).slice(0,2);
}

async function webSearch(q){
  const key = q.toLowerCase().trim().slice(0,120);
  if(webCache[key]) return webCache[key];
  if(typeof fetch === 'undefined') return [];
  const jobs = [
    srcWikipedia(q, 'it').catch(()=>[]),
    srcWikipedia(q, 'en').catch(()=>[]),
    srcDDG(q).catch(()=>[]),
    srcCrossref(q).catch(()=>[])
  ];
  const chunks = await Promise.all(jobs);
  const seen = {};
  const all = [];
  chunks.forEach(list => (list||[]).forEach(r => {
    const k = (r.url||'').replace(/[#?].*$/,'');
    if(!k || seen[k]) return;
    seen[k] = 1; all.push(r);
  }));
  const out = all.slice(0,6);
  if(out.length) webCache[key] = out;
  return out;
}

/* sintesi estrattiva: sceglie le frasi più vicine alla domanda */
function webSynth(q, sources){
  const qt = wTokens(q);
  const seen = new Set();
  const cand = [];
  sources.forEach((s, si) => {
    String(s.snippet||'').split(/(?<=[.!?])\s+/).forEach(p0 => {
      const clean = p0.replace(/\s+/g,' ').trim();
      if(clean.length < 45 || clean.length > 300) return;
      const tk = wTokens(clean);
      let hits = 0;
      tk.forEach(w => { if(qt.indexOf(w) >= 0) hits++; });
      if(hits === 0 && si > 0) return;
      const score = hits * 2.4 + (hits / Math.max(8, tk.length)) * 7 + Math.max(0, 3 - si) * 0.9;
      if(score < 2.4) return;
      const sig = tk.slice(0,7).join(' ');
      if(seen.has(sig)) return;
      seen.add(sig);
      cand.push({ clean, score, si });
    });
  });
  cand.sort((a,b)=> b.score - a.score);
  const out = [], used = [];
  for(const c of cand){
    const words = new Set(wTokens(c.clean));
    let dup = false;
    for(const u of used){
      let ov = 0; u.forEach(w => { if(words.has(w)) ov++; });
      if(ov > Math.min(u.size, words.size) * 0.6){ dup = true; break; }
    }
    if(dup) continue;
    used.push(words); out.push(c);
    if(out.length >= 4) break;
  }
  return out;
}

function knowledgeQuestion(q){
  const low = q.toLowerCase();
  return !/piano|programm|organizz|settiman|calendari|quiz|domand|test|verific|esercizi|interrog|flashcard|ripetizion|ripass|memorizz|pomodoro|concentr|distraz|ansia|stress|motivaz|feynman|parole mie/.test(low);
}

function webAnswerBlock(q, sources){
  const picked = webSynth(q, sources);
  if(!picked.length) return '';
  const bullets = picked.map(p => '• ' + p.clean + ' [' + (p.si + 1) + ']');
  const refs = [...new Set(picked.map(p => p.si + 1))].map(n => '[' + n + ']').join(' ');
  return bullets.join('\n') + '\n\nFonti: ' + refs + ' — schede numerate qui sotto';
}

  if(!db.subjects.length) return 'L\'utente non ha ancora caricato materiali.';
  return db.subjects.map(s => {
    const topics = extractTopics(s.text, 8).join(', ');
    const excerpt = summarize(s.text, 2).slice(0, 320);
    return `MATERIA: ${s.name}\nArgomenti: ${topics}\nEstratto: ${excerpt}`;
  }).join('\n\n').slice(0, 5000);
}

/* ------- risposta locale (senza API) ------- */
function localAnswer(q){
  const low = q.toLowerCase();
  const allText = db.subjects.map(s=>s.text).join('\n\n');
  const subject = db.subjects.find(s => low.includes(s.name.toLowerCase())) ||
                  db.subjects.find(s => s.id === ui.lastSubject) || db.subjects[0];

  if(/piano|programm|organizz|settiman|calendari/.test(low)){
    if(!subject) return { text:'Prima caricami un materiale: da lì costruisco il piano di studio con sessioni, richiami e verifiche. Vai su Materiali → Carica file.' };
    const p = planFor(subject.id);
    const prog = planProgress(subject.id);
    if(!p.length) return { text:`Non ho ancora un piano per “${subject.name}”. Posso generarlo in 2 secondi: sessioni da 30 min, richiami a distanza e una verifica finale.`, actions:[{label:'Genera piano', act:'genPlan', subjectId:subject.id}] };
    return {
      text:`Piano per “${subject.name}”: ${prog.total} sessioni, ${prog.done} completate (${prog.pct}%).\nProssima sessione: ${fmtDay(p.find(x=>!x.done)?.date || p[0].date)} — ${(p.find(x=>!x.done)||p[0]).topic}.`,
      actions:[{label:'Apri piano', act:'goTab', tab:'piano'}]
    };
  }
  if(/quiz|domand|test|verific|esercizi|interrog/.test(low)){
    return { text:'Ti preparo una sfida di 5 domande estratte dal tuo materiale, con spiegazione della risposta giusta alla fine. Pronto?', actions:[{label:'Sfida rapida', act:'startChallenge', n:5}] };
  }
  if(/flashcard|ripetizion|ripasso|memorizz|ricord/.test(low)){
    const due = dueCards(subject?.id).length;
    return {
      text:`Con la ripetizione dilazionata ripassi ogni concetto nell'attesa della curva dell'oblio: oggi 1° ripasso, poi 3 giorni, poi 7, poi 16.\nHai ${due} flashcard da ripassare adesso${subject?` per ${subject.name}`:''}.`,
      actions:[{label:'Ripassa ora', act:'startReview', subjectId: subject?.id}]
    };
  }
  if(/feynman|spiegare|parole mie/.test(low)){
    return { text:'Il metodo Feynman: scegli un argomento, spiegamelo come se avessi 12 anni. Ti dico subito cosa è chiaro e cosa manca.', actions:[{label:'Prova Feynman', act:'goTab', tab:'tutor', feynman:1}] };
  }
  if(/pomodoro|concentr|distraz|attenzione|ansia|stress|motivaz/.test(low)){
    return { text:'Protocollo anti-distrazione:\n1) 25 min di studio con telefono in un\'altra stanza.\n2) 5 min di pausa in piedi (niente social: la ricarica non arriva).\n3) Dopo 4 cicli, 20 min veri di pausa.\n4) Chiudi sempre con “cosa ho capito”: 60 secondi di self-test, vale più di un\'ora di rilettura.', actions:[{label:'Avvia Pomodoro', act:'startPomodoro'}] };
  }
  if(/ciao|ehi|salve|buongiorno|buonasera/.test(low) && low.length < 22){
    return { text:`Ciao! Sono il tuo tutor di studio.${subject?` Hai ${db.subjects.length} materia/e caricata/e, la più recente è “${subject.name}”.`:''}\nPosso: spiegarti un argomento, creare un piano, generare un quiz, farti ripassare con le flashcard. Da dove partiamo?` };
  }
  if(/quante|riassum|sintesi|riepilog|di che parla/.test(low) && allText){
    return { text:'Ecco la sintesi di '+subject.name+':\n\n'+summarize(subject.text, 4) };
  }

  // spiegazione dal materiale
  if(allText){
    const passage = bestPassage(subject.text, q) || bestPassage(allText, q);
    const kt = keyTerms(subject.text, 6);
    if(passage){
      return {
        text:`Dal tuo materiale su “${subject.name}”:\n\n“${passage}”\n\nIn sintesi: ${summarize(passage, 1)}\n\nProva a rispiegarlo a voce senza guardare (metodo Feynman): se ti blocchi su una parola, quello è il punto da rileggere.\n\nParole chiave: ${kt.slice(0,5).join(', ')}.`,
        actions:[{label:'Spiega a parole tue', act:'goTab', tab:'tutor', feynman:1}]
      };
    }
    return {
      text:`Non trovo questo punto nel materiale caricato. Posso comunque dirti che gli argomenti chiave di “${subject.name}” sono: ${kt.join(', ')}.\n\nVuoi una sfida su questi argomenti, oppure preferisci aggiungere altro materiale?`,
      actions:[{label:'Sfida su questi argomenti', act:'startChallenge', n:5}]
    };
  }
  return { text:'Non ho ancora materiale su cui lavorare. Carica un file (anche una semplice dispensa in .txt) o incolla il testo di un capitolo: da lì genero piano, quiz e flashcard tuoi.', actions:[{label:'Carica materiale', act:'goTab', tab:'materiali'}] };
}

/* ------- tutor: orchestratore ------- */
async function askTutor(q, opts){
  q = String(q || '').trim();
  if(!q) return;
  let forceWeb = false;
  if(/^\/(web|cerca)\b/i.test(q)){ forceWeb = true; q = q.replace(/^\/(web|cerca)\s*/i,'').trim(); }
  if(/\b(cerca|ricerca|trova)\b.*\b(online|sul web|su internet)\b/i.test(q)) forceWeb = true;

  db.chat.push({ role:'user', content:q });
  saveDB();
  const wantWeb = (forceWeb || (webOn() && knowledgeQuestion(q))) && isOnline();
  ui.thinking = true; ui.thinkingWeb = wantWeb; ui.thinkingDeep = hasLLM(); render();

  let sources = [];
  if(wantWeb){
    try{ sources = await webSearch(q); }catch(e){ sources = []; }
  }

  let answer;
  if(hasLLM()){
    try{
      const srcBlock = sources.length
        ? `\n\nFONTI DAL WEB (dati esterni aggiornati; usale per i fatti e cita il numero tra parentesi quadre):\n` +
          sources.map((s,i)=>`[${i+1}] ${s.title} (${s.source}) — ${s.snippet.slice(0,600)}`).join('\n')
        : '';
      const sys = `Sei "Studia AI", un tutor italiano esperto di metodologia dello studio. Rispondi in italiano, conciso (max 200 parole), concreto, con elenchi quando utile. Usa SOLO il materiale dell'utente quando pertinente e citalo.${sources.length?' Per le informazioni generali attieniti alle FONTI DAL WEB e cita [n] dopo ogni fatto che ne deriva. Non inventare dati non presenti nelle fonti.':''} Chiudi con una micro-azione da fare subito.\n\nCONTESTO MATERIALI DELL'UTENTE:\n${subjectContext()}${srcBlock}`;
      const msgs = [{ role:'system', content: sys }, ...db.chat.slice(-10).map(m=>({ role:m.role, content:m.content }))];
      answer = { text: await callLLM(msgs), engine:'llm', sources };
    }catch(e){
      answer = localAnswer(q);
      answer.text = '⚠️ AI esterna non raggiungibile ('+e.message+'). Rispondo con il motore locale.\n\n' + answer.text;
      answer.sources = sources;
    }
  }else{
    answer = localAnswer(q);
    const block = sources.length ? webAnswerBlock(q, sources) : '';
    if(block){
      const webPart = '🌐 Trovato online\n' + block;
      if(knowledgeQuestion(q)) answer = { text: webPart + (answer && answer.actions && answer.actions.length ? '\n\n' : ''), actions: answer.actions, sources };
      else answer = { text: answer.text + '\n\n' + webPart, actions: answer.actions, sources };
    }else{
      answer.sources = sources.length ? sources : null;
      if(!sources.length && isOnline() && webOn()) answer.text += '\n\n(nessuna fonte online trovata per questa domanda)';
    }
  }

  ui.thinking = false; ui.thinkingWeb = false; ui.thinkingDeep = false;
  db.chat.push({ role:'assistant', content: answer.text, actions: answer.actions || null, sources: (answer.sources && answer.sources.length) ? answer.sources.slice(0,5) : null });
  saveDB();
  render();
  try{ setTimeout(scrollAppBottom, 70); }catch(e){}
}

/* ------- feedback Feynman/* ------- feedback Feynman ------- */
function feynmanFeedback(topic, text){
  const s = db.subjects.find(x=>x.id===ui.lastSubject) || db.subjects[0];
  const material = s ? s.text : '';
  const passage = topic ? (bestPassage(material, topic) || '') : '';
  const topicLow = (topic || '').toLowerCase();
  const globalTerms = keyTerms(material, 50);
  const pool = globalTerms.filter(t =>
    usableTerm(t) && (topicLow.includes(t) || (passage && passage.toLowerCase().includes(t)))
  );
  const keyT = [...new Set(pool)].slice(0, 7);
  const low = text.toLowerCase();
  const covered = keyT.filter(k => low.includes(k));
  const missing = keyT.filter(k => !low.includes(k)).slice(0, 5);
  const mine = tokenize(text);
  const wordsN = mine.length;
  const avgLen = wordsN ? mine.join('').length / wordsN : 0;
  const ratio = keyT.length ? covered.length / keyT.length : 0;

  let verdict, tone;
  if(wordsN < 15){ verdict = 'Troppo breve: non riesco a capire se hai capito davvero.'; tone = 'warn'; }
  else if(ratio >= 0.5 && wordsN >= 28){ verdict = 'Spiegazione solida: hai toccato i concetti chiave con parole tue.'; tone = 'ok'; }
  else if(ratio >= 0.5){ verdict = 'Concetti giusti, ma la spiegazione è ancora scarna: allunga il ragionamento.'; tone = 'ok'; }
  else if(ratio >= 0.28){ verdict = 'Base giusta, ma resti sul vago nei passaggi centrali.'; tone = 'warn'; }
  else { verdict = 'Il collegamento con il materiale è debole: stai girando attorno all\'argomento.'; tone = 'bad'; }

  const tips = [];
  if(wordsN < 35) tips.push('Allunga: almeno 4 frasi, una per ogni passaggio logico (causa → effetto → esempio).');
  if(avgLen > 6.4) tips.push('Frasi troppo lunghe (media ' + avgLen.toFixed(1) + ' parole): spezzale, la chiarezza viene dalla sintassi semplice.');
  if(missing.length) tips.push('Concetti chiave che non hai nominato: ' + missing.join(', ') + '.');
  if(!/\b(perché|perche|quindi|di conseguenza|cioè|per esempio)\b/i.test(text)) tips.push('Aggiungi almeno un nesso logico (“perché”, “quindi”, “per esempio”): è quello che manca per capire, non per ricordare.');
  if(!tips.length) tips.push('Ora ripetilo in 30 secondi a voce alta senza note: è lì che si vede se è consolidato.');

  db.notes.push({ id:uid(), subjectId: s?s.id:null, topic: topic||'Spiegazione', text, at: Date.now() });
  addXP(ratio >= 0.4 ? 25 : 12, 'metodo Feynman');
  return { verdict, tone, tips, covered, missing, score: clamp(Math.round(ratio*100), 0, 100) };
}

function resExtras(text){

  if(/matematic|equazion|funzion|derivat|integral|fisic|vettor|forz|energi|chimic|molecol|reazion|geometri|probabilit/.test(l)) out.push('wolfram');

  if(/legg|articol|costituzion|diritt|norma|contratt|codic|sentenz/.test(l)) out.push('normattiva');
  if(/tesi|ricerca|studio sperimentale|dati|statistic/.test(l)) out.push('scholar');
  out.push('img','quizlet');
  return out;

function weekStats(){
  const days = [];
  for(let i = 6; i >= 0; i--){
    const d = addDays(today(), -i);
    const done = db.plan.filter(p => p.done && p.doneAt && iso(new Date(p.doneAt)) === d).length;
    days.push({ d, n: done, active: db.stats.days.includes(d) });
  }
  const maxN = Math.max(1, ...days.map(x => x.n));
  const minutes = db.plan.filter(p => p.done).reduce((a, p) => a + (p.minutes || 0), 0);
  const tot = db.stats.correct + db.stats.wrong;
  return { days, maxN, minutes, acc: tot ? Math.round(db.stats.correct / tot * 100) : 0 };
}

function methodOfDay(){
  const list = [
    { title:'Active recall', body:'Chiudi il libro e scrivi quello che ricordi per 3 minuti. Rileggere crea familiarità, ricordare crea memoria.' },
    { title:'Ripetizione dilazionata', body:'Ripassa a 1 giorno, 3 giorni, 7 giorni, 16 giorni. Il cervello consolida ciò che ritorna al momento giusto, non ciò che vedi spesso.' },
    { title:'Tecnica Feynman', body:'Spiega l\'argomento come a un bambino di 12 anni. Ogni punto in cui ti blocchi è esattamente ciò che non hai capito.' },
    { title:'Interleaving', body:'Alterna materie diverse nella stessa sessione invece di fare un blocco unico: sembra più difficile, ma l\'esame sarà così.' },
    { title:'Pomodoro 25/5', body:'25 minuti di focus totale, 5 di pausa reale. La costanza batte le maratone notturne.' },
    { title:'Elaborazione interrogativa', body:'Per ogni concetto chiediti “perché?” e “cosa succederebbe se non fosse così?”. Trasformi nozioni in comprensione.' }
  ];
  const d = Math.floor(Date.now()/86400000);
  return list[d % list.length];
}

/* ---------------- QUIZ ---------------- */
function fmtTime(s){ s = Math.max(0, Math.floor(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

function viewQuiz(){
  const q = ui.quiz;
  if(!q) return '';
  if(q.result) return viewQuizResult();
  const cur = q.qs[q.i];
  const ans = q.answers[q.i];
  const pct = (q.i + (ans ? 1 : 0)) / q.qs.length;
  const LABELS = {
    mc:'Completa il concetto', tf:'Vero o falso', def:'Riconosci l\'affermazione',
    odd:'Trova l\'intruso', open:'Risposta aperta'
  };
  const timed = (q.mode === 'challenge' || q.mode === 'survival');

  return `
  <div class="row between" style="margin:2px 0 12px">
    <button class="btn ghost xs" data-act="quizExit">✕ Esci</button>
    <div class="row" style="gap:7px">
      ${q.mode === 'survival' ? `<span class="pill bad">${'❤'.repeat(Math.max(0,q.lives))}${'♡'.repeat(Math.max(0,3-q.lives))}</span>` : ''}
      ${timed ? `<span class="pill warn ${q.secsLeft <= 6 ? 'bad' : ''}" id="qtime">${fmtTime(q.secsLeft)}</span>` : ''}
      <span class="pill acc">${q.i+1}/${q.qs.length}</span>
    </div>
  </div>
  <div class="bar" style="margin-bottom:18px"><i style="width:${Math.round(pct*100)}%"></i></div>

  <div class="card" style="background:radial-gradient(140% 140% at 0% 0%, rgba(99,102,241,.28), rgba(99,102,241,0) 60%)">
    <div class="micro" style="color:#C4C6FF">${LABELS[cur.type] || 'Domanda'}${q.combo > 1 ? ' · serie di ' + q.combo + ' 🔥' : ''}</div>
    <div style="font-size:17px;font-weight:650;line-height:1.5;margin-top:8px;letter-spacing:-.01em">${esc(cur.q)}</div>
    ${cur.type === 'open' ? `<div class="hint" style="margin-top:10px">Definizione → perché conta → un esempio. Poi confronta con il materiale.</div>` : ''}
  </div>

  ${cur.type === 'open' ? `
    <textarea id="openAnswer" placeholder="Scrivi qui la tua risposta (facoltativo)…" style="min-height:110px">${esc(q.openText || '')}</textarea>
    ${!q.revealed
      ? `<button class="btn wide" style="margin-top:10px" data-act="revealOpen">Mostra il riferimento</button>`
      : `<div class="card" style="margin-top:10px">
           <div class="h3">Riferimento dal tuo materiale</div>
           <div class="sm mut" style="margin-top:7px;line-height:1.6">${esc(cur.why)}</div>
         </div>
         ${!ans ? `<div class="grid2" style="margin-top:4px">
            <button class="btn bad" data-act="openGrade" data-ok="0">Ci ero poco</button>
            <button class="btn ok" data-act="openGrade" data-ok="1">Lo sapevo</button>
          </div>` : ''}`}
  ` : `
    ${cur.options.map((o,i)=>{
      let cls = '';
      if(ans){
        if(i === cur.answer) cls = 'right';
        else if(i === ans.idx) cls = 'wrong';
        else cls = 'dim';
      }
      return `<button class="qopt ${cls}" data-act="answer" data-i="${i}" ${ans?'disabled':''}>
        <span class="k">${String.fromCharCode(65+i)}</span><span class="grow">${esc(o)}</span>
      </button>`;
    }).join('')}
  `}

  ${ans ? `
    <div class="card" style="margin-top:14px;border-color:${ans.correct?'rgba(52,211,153,.4)':'rgba(248,113,113,.4)'};background:${ans.correct?'rgba(52,211,153,.1)':'rgba(248,113,113,.1)'}">
      <div class="h3" style="color:${ans.correct?'#9BE9C9':'#FFB9B9'}">${ans.correct ? '✅ Corretto' : (ans.timeout ? '⏱ Tempo scaduto' : (ans.open ? '📝 Autovalutazione salvata' : '❌ Non ci siamo'))}</div>
      <div class="sm mut" style="margin-top:6px;line-height:1.55">${esc(cur.why)}</div>
    </div>
    <button class="btn wide" style="margin-top:12px" data-act="nextQ">${q.i < q.qs.length-1 ? 'Domanda successiva →' : 'Vedi risultato →'}</button>
  ` : ''}`;
}

let sessionT = null;
function startSession(planId){
  const p = db.plan.find(x=>x.id===planId);
  if(!p) return;
  ui.session = { id: planId, secs: p.minutes*60, total: p.minutes*60, running:false };
  render();
  clearInterval(sessionT);
  sessionT = setInterval(()=>{
    const s = ui.session;
    if(!s || !s.running) return;
    s.secs--;
    const el = document.getElementById('sessClock');
    if(el) el.textContent = fmtTime(s.secs);
    const bar = document.getElementById('sessBar');
    if(bar) bar.style.width = (100 - s.secs/s.total*100)+'%';
    if(s.secs <= 0){
      s.running = false; clearInterval(sessionT);
      toast('Sessione completata! ⏰');
    }
  }, 1000);
}

function ensureFileInput(){
  if(document.getElementById('fileIn')) return;
  const inp = document.createElement('input');
  inp.type = 'file'; inp.id = 'fileIn'; inp.hidden = true;
  inp.accept = '.pdf,.pptx,.pptm,.ppt,.docx,.doc,.xlsx,.txt,.md,.markdown,.csv,.json,.html,.htm,.rtf,.srt';
  inp.multiple = true;
  inp.addEventListener('change', () => { handleFiles([...inp.files]); inp.value = ''; });
  document.body.appendChild(inp);
}
function readTextFile(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result || ''));
    r.onerror = () => rej(new Error('lettura fallita'));
    r.readAsText(file);
  });
}
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('libreria non disponibile offline'));
    document.head.appendChild(s);
  });
}
async function readPdf(file){
  if(!window.pdfjsLib){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const buf = await file.arrayBuffer();
  const doc = await window.pdfjsLib.getDocument({ data: buf }).promise;
  const out = [];
  for(let i=1; i<=Math.min(doc.numPages, 80); i++){
    const page = await doc.getPage(i);
    const tc = await page.getTextContent();
    out.push(tc.items.map(x => x.str).join(' '));
  }
  return out.join('\n\n');
}
function stripHtml(html){
  const d = document.createElement('div');
  d.innerHTML = html.replace(/<(script|style)[\s\S]*?<\/\1>/gi,' ');
  return (d.textContent || '').replace(/\n{3,}/g,'\n\n');
}

/* =========================================================================
   ESTRAZIONE TESTO DA FILE OFFICE (.pptx .docx .xlsx) — tutto in locale
   ========================================================================= */
async function unzip(buffer){
  const u8 = new Uint8Array(buffer);
  const dv = new DataView(buffer);
  let eocd = -1;
  const min = Math.max(0, u8.length - 66000);
  for(let i = u8.length - 22; i >= min; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('archivio non valido');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const entries = {};
  for(let n = 0; n < count; n++){
    if(off + 46 > dv.byteLength || dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const compSize = dv.getUint32(off + 20, true);
    const nameLen = dv.getUint16(off + 28, true);
    const extraLen = dv.getUint16(off + 30, true);
    const commentLen = dv.getUint16(off + 32, true);
    const localOff = dv.getUint32(off + 42, true);
    const name = new TextDecoder('utf-8').decode(u8.subarray(off + 46, off + 46 + nameLen));
    const lNameLen = dv.getUint16(localOff + 26, true);
    const lExtraLen = dv.getUint16(localOff + 28, true);
    const start = localOff + 30 + lNameLen + lExtraLen;
    entries[name] = { method, data: u8.subarray(start, start + compSize) };
    off += 46 + nameLen + extraLen + commentLen;
  }
  return entries;
}
async function readZipText(entry){
  if(!entry) return '';
  if(entry.method === 0) return new TextDecoder('utf-8').decode(entry.data);
  if(typeof DecompressionStream === 'undefined') throw new Error('browser non supportato');
  const stream = new Blob([entry.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return await new Response(stream).text();
}
function decodeXml(s){
  return s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'")
          .replace(/&#(\d+);/g,(_,d)=>String.fromCharCode(+d)).replace(/&amp;/g,'&');
}
function xmlParagraphs(xml){
  const paras = [];
  const pRe = /<(?:a|w):p[^>]*>([\s\S]*?)<\/(?:a|w):p>/g;
  let m;
  while((m = pRe.exec(xml))){
    const inner = m[1];
    const tRe = /<(?:a|w):t(?:\s[^>]*)?>([\s\S]*?)<\/(?:a|w):t>/g;
    let t, txt = '';
    while((t = tRe.exec(inner))) txt += decodeXml(t[1]);
    txt = txt.replace(/\s+/g, ' ').trim();
    if(txt) paras.push(txt);
  }
  return paras;
}
const FILE_JUNK = /^(powerpoint|microsoft|arial|calibri|times new roman|helvetica|wingdings|segoe|root entry|compobj|current user)/i;

/* .pptx — una sezione per diapositiva, con titolo come argomento */
async function extractPptx(buffer){
  const files = await unzip(buffer);
  const slideOf = name => { const m = name.match(/slide(\d+)\.xml$/); return m ? +m[1] : 0; };
  const slides = Object.keys(files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a,b) => slideOf(a) - slideOf(b));
  if(!slides.length) throw new Error('nessuna diapositiva leggibile');
  const notes = {};
  Object.keys(files).filter(n => /^ppt\/notesSlides\/notesSlide\d+\.xml$/.test(n))
    .forEach(n => { notes[slideOf(n)] = n; });

  const out = [];
  for(let i = 0; i < slides.length; i++){
    const paras = xmlParagraphs(await readZipText(files[slides[i]]))
      .filter(p => p.length > 1 && !FILE_JUNK.test(p) && !/^\d+$/.test(p));
    if(!paras.length) continue;
    const title = paras[0].replace(/[.:;]$/, '').trim();
    const bullets = paras.slice(1).map(b => b.replace(/\s+/g,' ').replace(/[.;:]$/,''));
    let block = '# ' + title + '\n\n';
    if(bullets.length) block += bullets.join('. ') + '.';
    else block += title + '.';
    const noteId = i + 1;
    if(notes[noteId]){
      const np = xmlParagraphs(await readZipText(files[notes[noteId]]))
        .filter(p => p.length > 30 && !FILE_JUNK.test(p));
      if(np.length) block += '\n\n' + np.slice(0, 3).join(' ');
    }
    out.push(block);
  }
  if(!out.length) throw new Error('nessun testo nelle diapositive');
  return out.join('\n\n');
}

/* .docx */
async function extractDocx(buffer){
  const files = await unzip(buffer);
  const xml = await readZipText(files['word/document.xml']);
  if(!xml) throw new Error('documento non valido');
  const paras = xmlParagraphs(xml).filter(p => !FILE_JUNK.test(p));
  if(!paras.length) throw new Error('nessun testo nel documento');
  return paras.map(p => (p.length < 68 && !/[.!?]$/.test(p) ? '# ' + p : p)).join('\n\n');
}

/* .xlsx — stringhe condivise, raggruppate in righe leggibili */
async function extractXlsx(buffer){
  const files = await unzip(buffer);
  const xml = await readZipText(files['xl/sharedStrings.xml']);
  if(!xml) throw new Error('foglio senza testo');
  const strings = [];
  const re = /<si[^>]*>([\s\S]*?)<\/si>/g;
  let m;
  while((m = re.exec(xml))){
    const tRe = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g;
    let t, txt = '';
    while((t = tRe.exec(m[1]))) txt += decodeXml(t[1]);
    txt = txt.replace(/\s+/g,' ').trim();
    if(txt && !FILE_JUNK.test(txt)) strings.push(txt);
  }
  if(!strings.length) throw new Error('foglio senza testo');
  const rows = [];
  for(let i = 0; i < strings.length; i += 6) rows.push(strings.slice(i, i + 6).join(' · '));
  return rows.join('\n\n');
}

/* .ppt legacy (binario) — estrazione euristica, il testo va rivisto dall'utente */
function extractLegacyPpt(buffer){
  const u8 = new Uint8Array(buffer);
  const runs = [];
  let cur = '';
  for(let i = 0; i + 1 < u8.length; i += 2){
    const code = u8[i] | (u8[i+1] << 8);
    const ok = (code >= 32 && code < 127) || (code >= 0xC0 && code <= 0x24F) || code === 0x20AC || (code >= 0x2010 && code <= 0x201F);
    if(ok) cur += String.fromCharCode(code);
    else { if(cur.length >= 8) runs.push(cur); cur = ''; }
  }
  if(cur.length >= 8) runs.push(cur);
  const clean = s => s.replace(/\s+/g,' ').replace(/^[^A-Za-zÀ-ÿ]+/,'').replace(/\s+$/,'');
  const seen = new Set();
  const out = [];
  runs.map(clean).forEach(s => {
    if(s.length < 8 || FILE_JUNK.test(s)) return;
    if(!/[a-zàèéìòùç]{2,}/i.test(s)) return;
    if(!/[\s]/.test(s)) return;
    const k = s.toLowerCase();
    if(seen.has(k)) return;
    seen.add(k);
    out.push(/[.!?]$/.test(s) ? s : s + '.');
  });
  return out.join('\n\n');
}

function download(filename, content, mime){
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function icsEscape(s){
  return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
}

async function handleFiles(files){
  if(!files || !files.length) return;
  toast('Sto leggendo il file…', 1400);
  for(const f of files){
    const baseName = f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    let text = '', kind = 'TESTO';

    try{
      if(ext === 'pdf'){
        text = await readPdf(f); kind = 'PDF';
      } else if(ext === 'pptx' || ext === 'pptm'){
        text = await extractPptx(await f.arrayBuffer()); kind = 'PPTX';
      } else if(ext === 'docx'){
        text = await extractDocx(await f.arrayBuffer()); kind = 'DOCX';
      } else if(ext === 'xlsx'){
        text = await extractXlsx(await f.arrayBuffer()); kind = 'XLSX';
      } else if(ext === 'ppt' || ext === 'doc'){
        const legacy = extractLegacyPpt(await f.arrayBuffer());
        if(legacy.length > 150){
          openSheet({
            type:'paste', name: baseName, text: legacy,
            note:'Formato Office legacy: ho estratto il testo in modo automatico. Controllalo e correggi prima di salvare.'
          });
        } else {
          toast('Da questo file non riesco a leggere il testo: incollalo a mano ✍️', 3200);
          openSheet({ type:'paste', name: baseName });
        }
        continue;
      } else if(ext === 'html' || ext === 'htm'){
        text = stripHtml(await readTextFile(f)); kind = 'HTML';
      } else {
        text = await readTextFile(f);
        kind = ext ? ext.toUpperCase() : 'TESTO';
      }
    }catch(e){
      const msg = ext === 'pdf'
        ? 'PDF non leggibile offline: incolla il testo oppure riprova con internet'
        : 'Estrazione non riuscita (' + (e.message || 'formato non supportato') + '): incolla il testo';
      toast(msg, 3600);
      openSheet({ type:'paste', name: baseName });
      continue;
    }

    const s = addSubject(baseName, text, f.name, kind);
    if(s) afterMaterial(s);
  }
}
function afterMaterial(s){
  const topics = extractTopics(s.text, 6);

    ]
  });
}

La fotosintesi è il processo con cui le piante, le alghe e alcuni batteri trasformano l'energia luminosa in energia chimica, producendo glucosio e liberando ossigeno. Avviene principalmente nei cloroplasti, organelli presenti nelle cellule delle foglie.

Le fasi della fotosintesi

La fase luminosa si svolge sulle membrane dei tilacoidi e richiede luce: la clorofilla assorbe i fotoni, l'acqua viene scissa e si libera ossigeno, mentre l'energia viene immagazzinata in ATP e NADPH.

/* =========================================================================
   GOOGLE DRIVE — import diretto (OAuth utente o link pubblico + API key)
   ========================================================================= */
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.readonly';
const DRIVE_TYPES = [
  { re:/application\/pdf/i,                                 label:'PDF',          color:'#F87171', glyph:'PDF' },
  { re:/presentationml|google-apps\.presentation/i,         label:'Presentazione',color:'#F5B84B', glyph:'PPT' },
  { re:/wordprocessingml|google-apps\.document/i,           label:'Documento',    color:'#60A5FA', glyph:'DOC' },
  { re:/spreadsheetml|google-apps\.spreadsheet/i,           label:'Foglio',       color:'#34D399', glyph:'XLS' },
  { re:/^text\/|markdown|json/i,                            label:'Testo',        color:'#A78BFA', glyph:'TXT' }
];
function driveType(mt){ return DRIVE_TYPES.find(t => t.re.test(mt || '')) || null; }
function driveColor(mt){ const t = driveType(mt); return t ? t.color : '#94A3B8'; }
function driveGlyph(mt){ const t = driveType(mt); return t ? t.glyph : 'FILE'; }
function driveLabel(mt){ const t = driveType(mt); return t ? t.label : 'File'; }
function driveState(){ if(!ui.drive) ui.drive = { files:[], q:'', loading:false, error:'' }; return ui.drive; }
function refreshSheet(){ if(ui.sheet){ ui.sheet.nonce = uid(); render(); } else render(); }
const driveConfigured = () => !!(db.settings.driveClientId || db.settings.driveApiKey);

let gToken = null, gTokenExp = 0;
function gisReady(){ return !!(window.google && window.google.accounts && window.google.accounts.oauth2); }
async function ensureGis(){
  if(gisReady()) return true;
  await loadScript('https://accounts.google.com/gsi/client');
  return gisReady();
}
function requestDriveToken(){
  const clientId = (db.settings.driveClientId || '').trim();
  if(!clientId) return Promise.reject(new Error('Client ID OAuth non configurato'));
  if(gToken && Date.now() < gTokenExp - 60000) return Promise.resolve(gToken);
  return new Promise((resolve, reject) => {
    if(!gisReady()){ reject(new Error('libreria Google non disponibile: controlla la connessione')); return; }
    try{
      const tc = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: DRIVE_SCOPE,
        callback: r => {
          if(r && r.access_token){
            gToken = r.access_token;
            gTokenExp = Date.now() + (r.expires_in || 3600) * 1000;
            resolve(gToken);
          } else reject(new Error((r && r.error) || 'autorizzazione annullata'));
        }
      });
      tc.requestAccessToken({ prompt: gToken ? '' : 'consent' });
    }catch(e){ reject(e); }
  });
}
function driveParams(extra){
  const p = new URLSearchParams(extra || {});
  const k = (db.settings.driveApiKey || '').trim();
  if(k) p.set('key', k);
  return p.toString();
}
function driveAuthHeaders(){
  return (gToken && Date.now() < gTokenExp) ? { Authorization:'Bearer ' + gToken } : {};
}

async function driveSearch(){
  const d = driveState();
  const input = document.getElementById('driveQ');
  if(input && typeof input.value === 'string') d.q = input.value.trim();
  d.loading = true; d.error = ''; refreshSheet();
  try{
    const token = await requestDriveToken();
    const q = 'trashed=false' + (d.q ? " and name contains '" + d.q.replace(/'/g,'') + "'" : '');
    const url = 'https://www.googleapis.com/drive/v3/files?' + driveParams({
      q, orderBy:'modifiedTime desc', pageSize:'40',
      fields:'files(id,name,mimeType,size,modifiedTime)'
    });
    const res = await fetch(url, { headers:{ Authorization:'Bearer ' + token } });
    if(res.status === 401){ gToken = null; throw new Error('sessione scaduta, riprova'); }
    if(!res.ok) throw new Error('risposta ' + res.status);
    const data = await res.json();
    d.files = (data.files || []).filter(f => driveType(f.mimeType));
  }catch(e){
    d.error = e.message || 'errore sconosciuto';
  }
  d.loading = false; refreshSheet();
}

async function driveImport(fileId, rawName, mimeType){
  const name = String(rawName || 'File Drive').replace(/\.[^.]+$/, '');
  toast('Scarico da Google Drive…', 1600);
  try{
    const isGoogleFile = /^application\/vnd\.google-apps\./.test(mimeType);
    let url, kind = 'TEXT';
    if(isGoogleFile){
      if(/spreadsheet/.test(mimeType)){
        url = 'https://www.googleapis.com/drive/v3/files/' + fileId + '/export?' + driveParams({ mimeType:'text/csv' });
        kind = 'TEXT';
      } else if(/presentation/.test(mimeType)){
        url = 'https://www.googleapis.com/drive/v3/files/' + fileId + '/export?' + driveParams({ mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
        kind = 'PPTX';
      } else {
        url = 'https://www.googleapis.com/drive/v3/files/' + fileId + '/export?' + driveParams({ mimeType:'text/plain' });
        kind = 'TEXT';
      }
    } else {
      url = 'https://www.googleapis.com/drive/v3/files/' + fileId + '?' + driveParams({ alt:'media' });
      kind = /presentationml/.test(mimeType) ? 'PPTX'
           : /wordprocessingml/.test(mimeType) ? 'DOCX'
           : /spreadsheetml/.test(mimeType) ? 'XLSX'
           : /pdf/.test(mimeType) ? 'PDF' : 'TEXT';
    }
    const res = await fetch(url, { headers: driveAuthHeaders() });
    if(!res.ok) throw new Error('download non riuscito (' + res.status + ')');

    let text = '';
    if(kind === 'TEXT'){
      text = await res.text();
    } else {
      const buf = await res.arrayBuffer();
      if(kind === 'PPTX') text = await extractPptx(buf);
      else if(kind === 'DOCX') text = await extractDocx(buf);
      else if(kind === 'XLSX') text = await extractXlsx(buf);
      else if(kind === 'PDF') text = await readPdf(new Blob([buf], { type:'application/pdf' }));
      else text = new TextDecoder().decode(buf);
    }
    const s = addSubject(name, text, 'Google Drive', kind === 'TEXT' ? 'DRIVE' : kind);
    closeSheet();
    if(s) setTimeout(() => afterMaterial(s), 160);
  }catch(e){
    toast('Import non riuscito: ' + (e.message || 'errore'), 3800);
  }
}

function driveIdFromLink(link){
  const s = String(link || '');
  const m = s.match(/\/d\/([a-zA-Z0-9_-]{10,})/) || s.match(/[?&]id=([a-zA-Z0-9_-]{10,})/) || s.match(/^([a-zA-Z0-9_-]{20,})$/);
  return m ? m[1] : null;
}
async function driveImportFromLink(){
  const input = document.getElementById('driveLink');
  const id = driveIdFromLink(input && typeof input.value === 'string' ? input.value : '');
  if(!id){ toast('Link Drive non riconosciuto'); return; }
  if(!db.settings.driveApiKey && !gToken){ toast('Serve una chiave API (o collega l\'account) per i link'); return; }
  try{
    const res = await fetch('https://www.googleapis.com/drive/v3/files/' + id + '?' + driveParams({ fields:'id,name,mimeType' }), { headers: driveAuthHeaders() });
    if(!res.ok) throw new Error(res.status === 404 ? 'file non trovato o non condiviso pubblicamente' : 'errore ' + res.status);
    const meta = await res.json();
    if(!driveType(meta.mimeType)) throw new Error('formato non supportato');
    await driveImport(meta.id, meta.name, meta.mimeType);
  }catch(e){
    toast('Import non riuscito: ' + (e.message || 'errore'), 3800);
  }
}

    ${(!d.loading && !d.files.length && !d.error) ? `<div class="card flat" style="text-align:center"><div class="sm mut" style="margin-bottom:12px">Nessun file caricato ancora.</div><button class="btn sm" data-act="driveConnect">${hasOAuth ? '🔗 Collega e sfoglia Drive' : 'Configura il collegamento'}</button></div>` : ''}
  `;

  return `
    <div class="h2">Importa da Google Drive</div>
