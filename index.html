/* =========================================================================
   AZIONI
   ========================================================================= */
async function handleAct(act, d, el){
  switch(act){

    /* ---- navigazione ---- */
    case 'goTab': {
      ui.tab = d.tab || d.tab2 || 'oggi';
      ui.quiz = null; ui.review = null; ui.session = null; ui.match = null;
      closeSheet(); render();
      if(d.feyn === '1' || d.feynman === '1') setTimeout(()=>openSheet({type:'feynman'}), 120);
      scrollAppTop();
      break;
    }
    case 'selectSubject':
      ui.lastSubject = d.id; render(); break;

    /* ---- materiali ---- */
    case 'openUpload': ensureFileInput(); document.getElementById('fileIn').click(); break;
    case 'openPaste': openSheet({ type:'paste' }); break;
    case 'openDrive': {
      openSheet({ type:'drive' });
      if((db.settings.driveClientId || '').trim()) ensureGis().catch(()=>{});
      break;
    }
    case 'driveConfig': openSheet({ type:'driveSetup' }); break;
    case 'driveSave': {
      const idEl = document.getElementById('driveClientId'), keyEl = document.getElementById('driveApiKey');
      db.settings.driveClientId = ((idEl && idEl.value) || '').trim();
      db.settings.driveApiKey = ((keyEl && keyEl.value) || '').trim();
      saveDB();
      toast('Configurazione Drive salvata');
      openSheet({ type:'drive' });
      if(db.settings.driveClientId) ensureGis().then(()=>driveSearch()).catch(()=>{});
      break;
    }
    case 'driveConnect': {
      if(!(db.settings.driveClientId || '').trim()){ openSheet({ type:'driveSetup' }); break; }
      driveSearch();
      break;
    }
    case 'driveRefresh': driveSearch(); break;
    case 'drivePick': driveImport(d.id, d.name, d.mime); break;
    case 'driveLink': driveImportFromLink(); break;
    case 'loadDemo': loadDemo(); break;
    case 'savePaste': {
      const name = document.getElementById('pasteName').value;
      const text = document.getElementById('pasteText').value;
      const s = addSubject(name, text, 'incollato');
      if(s){ closeSheet(); setTimeout(()=>afterMaterial(s), 150); }
      break;
    }
    case 'delSubject':
      openSheet({ type:'confirm', title:'Eliminare la materia?', body:'Verranno rimossi materiale, sessioni e flashcard collegate.', confirmAct:'doDelSubject', confirmLabel:'Elimina', id:d.id });
      break;
    case 'doDelSubject': {
      db.subjects = db.subjects.filter(x=>x.id!==d.id);
      db.plan = db.plan.filter(x=>x.subjectId!==d.id);
      db.cards = db.cards.filter(x=>x.subjectId!==d.id);
      if(ui.lastSubject === d.id) ui.lastSubject = db.subjects[0]?.id || null;
      saveDB(); closeSheet(); toast('Materia eliminata'); render();
      break;
    }
    case 'exportData': {
      download('studia-ai-backup-'+today()+'.json', JSON.stringify(db, null, 2), 'application/json');
      toast('Backup esportato ⬇️');
      break;
    }
    case 'exportIcs': exportICS(); break;
    case 'importData': {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json';
      inp.onchange = async () => {
        try{
          const txt = await readTextFile(inp.files[0]);
          const parsed = JSON.parse(txt);
          if(!parsed.subjects) throw new Error('formato');
          db = Object.assign(DEF(), parsed);
          saveDB(); closeSheet(); toast('Dati importati ✅'); render();
        }catch(e){ toast('File non valido ❌'); }
      };
      inp.click();
      break;
    }
    case 'resetData':
      openSheet({ type:'confirm', title:'Cancellare tutto?', body:'Materiali, piani, XP e flashcard verranno eliminati da questo dispositivo. L\'operazione è irreversibile.', confirmAct:'doReset', confirmLabel:'Cancella tutto' });
      break;
    case 'doReset':
      localStorage.removeItem(DB_KEY); db = DEF(); ui = { tab:'oggi', quiz:null, session:null, sheet:null, timer:null, feynman:null, thinking:false, lastSubject:null };
      saveDB(); closeSheet(); toast('Tutto azzerato'); render();
      break;

    /* ---- piano ---- */
    case 'genPlan':
      if(!db.subjects.length){ toast('Prima carica un materiale 📄'); break; }
      openSheet({ type:'plan', id: d.id || ui.lastSubject || db.subjects[0].id });
      break;
    case 'createPlan': {
      const deadline = document.getElementById('planDeadline').value || addDays(today(),7);
      const minutes = parseInt(document.getElementById('planMinutes').value, 10) || 60;
      const n = buildPlan(d.id, { deadline, minutesPerDay: minutes });
      ui.lastSubject = d.id;
      closeSheet();
      ui.tab = 'piano'; render();
      toast(n ? 'Piano creato: '+n+' sessioni 🗺️' : 'Aggiungi più testo per creare il piano');
      addXP(15, 'piano creato');
      break;
    }
    case 'togglePlan': {
      const p = db.plan.find(x=>x.id===d.id);
      if(!p) break;
      p.done = !p.done; p.doneAt = p.done ? Date.now() : null;
      if(p.done){ db.stats.sessions = (db.stats.sessions||0)+1; addXP(20, 'sessione completata'); }
      saveDB(); render();
      break;
    }
    case 'openSession': startSession(d.id); break;
    case 'sessionExit': ui.session = null; clearInterval(sessionT); render(); break;
    case 'timerToggle': if(ui.session) ui.session.running = !ui.session.running; render(); break;
    case 'timerReset': if(ui.session){ ui.session.secs = ui.session.total; ui.session.running = false; } render(); break;
    case 'sessionDone': {
      const p = db.plan.find(x=>x.id===d.id);
      if(p){
        p.done = !p.done;
        if(p.done){ db.stats.sessions = (db.stats.sessions||0)+1; addXP(20, 'sessione completata'); }
        saveDB();
      }
      ui.session = null; clearInterval(sessionT); render();
      break;
    }
    case 'sessionQuiz': {
      const s = ui.session;
      const p = s ? db.plan.find(x=>x.id===s.id) : null;
      if(!p) break;
      const qs = buildQuestions([p.subjectId], 3);
      if(!qs.length){ toast('Testo troppo breve per il quiz 📄'); break; }
      ui.session = null; clearInterval(sessionT);
      startQuiz(qs, 'study');
      break;
    }

    /* ---- flashcard ---- */
    case 'openDeck': openDeck(d.id || null); break;
    case 'deckBack': ui.deck = null; render(); scrollAppTop(); break;
    case 'deckFilter': if(ui.deck){ ui.deck.subjectId = d.id || null; ui.deck.q = ''; render(); } break;
    case 'newCard': openSheet({ type:'cardEdit', subjectId: d.id || (ui.deck && ui.deck.subjectId) || null }); break;
    case 'editCard': {
      const c = db.cards.find(x => x.id === d.id);
      if(c) openSheet({ type:'cardEdit', card: c });
      break;
    }
    case 'saveCard': {
      const val = id => { const el = document.getElementById(id); return el && typeof el.value === 'string' ? el.value : ''; };
      const front = val('cardFront').trim();
      const back = val('cardBack').trim();
      const sid = val('cardSubject') || (ui.deck && ui.deck.subjectId) || (db.subjects[0] && db.subjects[0].id) || null;
      if(front.length < 2 || back.length < 2){ toast('Compila fronte e retro ✍️'); break; }
      const editingId = ui.sheet && ui.sheet.card && ui.sheet.card.id;
      if(editingId){
        const c = db.cards.find(x => x.id === editingId);
        if(c){ c.front = front; c.back = back; c.subjectId = sid; }
        saveDB(); closeSheet(); toast('Flashcard aggiornata ✓'); render();
      } else {
        addCard({ front, back, subjectId: sid });
        db.stats.xp += 5; touchDay(); saveDB();
        if(d.again === '1'){
          ui.sheet = { type:'cardEdit', subjectId: sid, nonce: uid() };
          render(); toast('Aggiunta: scrivine un\'altra');
        } else {
          closeSheet(); toast('Flashcard creata 🃏'); render();
        }
      }
      break;
    }
    case 'delCard': {
      const c = db.cards.find(x => x.id === d.id);
      openSheet({ type:'confirm', title:'Eliminare la flashcard?', body: c ? '“' + c.front.slice(0,90) + '”' : '', confirmAct:'doDelCard', confirmLabel:'Elimina', id: d.id });
      break;
    }
    case 'doDelCard':
      db.cards = db.cards.filter(c => c.id !== d.id);
      saveDB(); closeSheet(); toast('Flashcard eliminata'); render();
      break;
    case 'cardBulk': openSheet({ type:'cardBulk', subjectId: d.id || (ui.deck && ui.deck.subjectId) || null }); break;
    case 'bulkSave': {
      const el = document.getElementById('bulkText');
      const sel = document.getElementById('bulkSubject');
      const sid = (sel && sel.value) || (ui.deck && ui.deck.subjectId) || (db.subjects[0] && db.subjects[0].id) || null;
      const rows = parseCardLines(el ? el.value : '');
      if(!rows.length){ toast('Nessuna riga valida: usa fronte | retro'); break; }
      rows.forEach(r => addCard({ front:r.front, back:r.back, subjectId:sid }));
      saveDB(); closeSheet(); toast(rows.length + ' flashcard importate 🃏'); render();
      break;
    }
    case 'deckStudy': startReviewFlow(d.id || null, d.all === '1'); break;
    case 'deckGenerate': {
      const sid = d.id || (ui.deck && ui.deck.subjectId);
      if(!sid){ toast('Scegli una materia per generare dal testo'); break; }
      const n = buildCards(sid);
      saveDB(); toast(n ? n + ' flashcard generate dal testo 🃏' : 'Nessun nuovo argomento da convertire');
      render();
      break;
    }
    case 'genCards': {
      const n = buildCards(d.id || ui.lastSubject || db.subjects[0]?.id);
      saveDB();
      toast(n ? n+' flashcard create 🃏' : 'Flashcard già presenti');
      render();
      break;
    }
    case 'startReview': startReviewFlow(d.id || null); break;
    case 'reveal': ui.review.show = true; render(); break;
    case 'grade': {
      const c = ui.review.cards[ui.review.i];
      reviewCard(c.id, d.ok === '1');
      if(d.ok === '1'){ ui.review.ok++; addXP(6, 'flashcard'); } else { addXP(2); }
      ui.review.i++; ui.review.show = false;
      saveDB(); render();
      break;
    }
    case 'reviewExit': ui.review = null; render(); break;

    /* ---- quiz ---- */
    case 'answer': answerQuiz(parseInt(d.i,10)); break;
    case 'nextQ': nextQuestion(); break;
    case 'quizExit': ui.quiz = null; clearInterval(quizTimer); render(); scrollAppTop(); break;
    case 'retryQuiz': {
      const qs = ui.quiz.qs; ui.quiz = null; startQuiz(shuffle(qs), 'study'); break;
    }
    case 'newChallenge': ui.quiz = null; startChallenge(5); break;
    case 'startChallenge': startChallenge(parseInt(d.n||5,10), d.mode||'challenge'); break;
    case 'dailyChallenge': startDaily(); break;
    case 'matchStart': startMatch(parseInt(d.n||4,10)); break;
    case 'matchTap': tapMatch(d.key); break;
    case 'matchExit': ui.match = null; render(); break;
    case 'revealOpen': if(ui.quiz){ ui.quiz.revealed = true; render(); } break;
    case 'openGrade': {
      const q = ui.quiz; if(!q || q.answers[q.i]) break;
      const ok = d.ok === '1';
      q.answers[q.i] = { idx:-1, correct:ok, open:true };
      if(ok){ db.stats.correct++; q.combo = (q.combo||0)+1; db.stats.xp += 8; touchDay(); }
      else { db.stats.wrong++; q.combo = 0; }
      saveDB(); render();
      break;
    }
    case 'resTopic': openSheet({ type:'resources', topic:d.topic, subjectId:d.id }); break;
    case 'startSubjectChallenge': {
      const qs = buildQuestions([d.id], 5);
      if(!qs.length){ toast('Servono più materiali per la sfida 📄'); break; }
      closeSheet(); startQuiz(qs, 'challenge');
      break;
    }

    /* ---- tutor ---- */
    case 'sendChat': sendChatFromUI(); break;
    case 'quickAsk': closeSheet(); ui.tab = 'tutor'; askTutor(d.q); break;
    case 'askAbout': {
      const s = db.subjects.find(x=>x.id===d.id);
      ui.lastSubject = d.id;
      ui.tab = 'tutor';
      askTutor('Spiegami i concetti principali di '+(s?s.name:'questa materia'));
      break;
    }
    case 'methodHow': {
      const m = methodOfDay();
      ui.tab = 'tutor';
      askTutor('Come applico il metodo "'+m.title+'" ai miei materiali?');
      break;
    }
    case 'openFeynman':
      openSheet({ type:'feynman', topic: d.topic || '' });
      break;
    case 'feySubmit': {
      const topic = document.getElementById('feyTopic').value.trim();
      const text = document.getElementById('feyText').value.trim();
      if(text.split(/\s+/).length < 8){ toast('Scrivi almeno qualche frase ✍️'); break; }
      const result = feynmanFeedback(topic, text);
      ui.sheet = { type:'feynman', topic, text, result, nonce: uid() };
      render();
      break;
    }

    /* ---- impostazioni ---- */
    case 'openSettings': openSheet({ type:'settings' }); break;
    case 'toggleWeb': {
      db.settings.web = !webOn();
      saveDB(); render();
      toast(webOn() ? 'Ricerca online attiva 🌐' : 'Ricerca online disattivata');
      break;
    }
    case 'openSourceSearch': {
      ui.tab = 'tutor';
      askTutor('Cerca online: ' + (d.q || ''));
      break;
    }
    case 'saveSettings': {
      db.settings.key = document.getElementById('setKey').value.trim();
      db.settings.endpoint = document.getElementById('setEndpoint').value.trim() || DEF().settings.endpoint;
      db.settings.model = document.getElementById('setModel').value.trim() || 'gpt-4o-mini';
      saveDB(); closeSheet(); toast(hasLLM() ? 'AI esterna collegata 🤖' : 'Salvato · motore locale');
      render();
      break;
    }
    case 'closeSheet': closeSheet(); break;
    default: break;
  }
}

let quizTimer = null;

function startChallenge(n, mode){
  const qs = buildQuestions(null, n);
  if(!qs.length){ toast('Carica un materiale più corposo per giocare 📄'); return; }
  startQuiz(qs, mode || 'challenge');
}
function startDaily(){
  if(db.stats.dailyDay === today()){ toast('Sfida del giorno già completata: torna domani ⏳', 2600); }
  const qs = buildQuestions(null, 7);
  if(!qs.length){ toast('Servono materiali per la sfida del giorno 📄'); return; }
  ui.tab = 'sfida';
  startQuiz(qs, 'daily');
}
function startQuiz(questions, mode){
  if(!questions || !questions.length){ toast('Servono più materiali: carica un testo più lungo 📄'); return; }
  ui.review = null; ui.session = null; ui.match = null;
  const m = mode || 'study';
  ui.quiz = {
    qs: questions, i:0, answers:[], mode: m, combo:0, best:0, result:null, revealed:false,
    lives: m === 'survival' ? 3 : 0,
    secsLeft: m === 'survival' ? 20 : questions.length * 15
  };
  render(); scrollAppTop();
  clearInterval(quizTimer);
  if(m === 'challenge' || m === 'survival') quizTimer = setInterval(tickQuiz, 1000);
}
function tickQuiz(){
  const q = ui.quiz;
  if(!q || q.result){ clearInterval(quizTimer); return; }
  if(q.answers[q.i]) return;
  q.secsLeft--;
  const el = document.getElementById('qtime');
  if(el) el.textContent = fmtTime(q.secsLeft);
  if(q.secsLeft > 0) return;

  if(q.mode === 'survival'){
    if(!q.answers[q.i]){
      q.answers[q.i] = { idx:-1, correct:false, timeout:true };
      q.combo = 0; q.lives--; db.stats.wrong++; saveDB();
    }
    if(q.lives <= 0){ finishQuiz(); return; }
    if(q.i < q.qs.length - 1){ q.i++; q.secsLeft = 20; q.revealed = false; render(); }
    else finishQuiz();
  } else {
    finishQuiz();
  }
}
function applyResult(correct){
  const q = ui.quiz;
  if(!q || q.result || (q.lives !== undefined && q.lives <= 0 && q.mode === 'survival')){ return; }
  if(correct){
    q.combo++; q.best = Math.max(q.best, q.combo); db.stats.correct++;
    if(q.mode !== 'study') addXP(12 + Math.min(18, q.combo * 3), 'risposta corretta');
  } else {
    q.combo = 0; db.stats.wrong++;
    if(q.mode === 'survival'){
      q.lives--;
      if(q.lives <= 0){ db.stats.wrong++; finishQuiz(); return; }
    }
  }
  saveDB();
}
function answerQuiz(idx){
  const q = ui.quiz; if(!q || q.result) return;
  const cur = q.qs[q.i];
  if(q.answers[q.i] || cur.type === 'open') return;
  const correct = idx === cur.answer;
  q.answers[q.i] = { idx, correct };
  applyResult(correct);
  render();
}
function nextQuestion(){
  const q = ui.quiz; if(!q || q.result) return;
  q.revealed = false;
  if(q.mode === 'survival') q.secsLeft = 20;
  if(q.i < q.qs.length - 1){ q.i++; render(); }
  else finishQuiz();
}
function finishQuiz(){
  const q = ui.quiz; if(!q || q.result) return;
  clearInterval(quizTimer);
  const right = q.answers.filter(a => a && a.correct).length;
  const total = q.qs.length;
  const pct = Math.round(right / total * 100);
  q.result = { right, total, pct, mode:q.mode, best:q.best };
  if(q.mode === 'survival') db.stats.survival = (db.stats.survival || 0) + 1;
  if(q.mode !== 'study'){
    db.stats.challengeCount = (db.stats.challengeCount || 0) + 1;
    if(pct > (db.stats.challengeBest || 0)) db.stats.challengeBest = pct;
    addXP(right * 4, 'sfida completata');
  }
  if(q.mode === 'daily' && db.stats.dailyDay !== today()){
    db.stats.dailyDay = today();
    addXP(60, 'sfida del giorno');
  }
  saveDB(); render(); scrollAppTop();
}

/* ---------------- GIOCO DEGLI ABBINAMENTI ---------------- */
function matchPool(){
  let pool = db.cards.map(c => ({ a:c.front, b:(c.back || '').slice(0, 130) }));
  db.subjects.forEach(s => {
    extractTopics(s.text, 10).forEach(t => {
      const p = bestPassage(s.text, t) || summarize(s.text, 1);
      if(p) pool.push({ a:t, b:p.slice(0, 130) });
    });
  });
  const seen = new Set();
  return pool.filter(p => {
    if(!p.a || !p.b || p.b.length < 30) return false;
    const k = (p.a + '|' + p.b).toLowerCase();
    if(seen.has(k)) return false;
    seen.add(k); return true;
  });
}
function startMatch(n=4){
  const pairs = shuffle(matchPool()).slice(0, n);
  if(pairs.length < 3){ toast('Servono più materiali per gli abbinamenti 📄'); return; }
  const tiles = [];
  pairs.forEach((p, i) => {
    tiles.push({ key:'a'+i, pid:i, kind:'term', text:p.a, done:false });
    tiles.push({ key:'b'+i, pid:i, kind:'def',  text:p.b, done:false });
  });
  ui.quiz = null; ui.review = null; ui.session = null;
  ui.match = { pairs, tiles: shuffle(tiles), sel:null, wrong:null, mistakes:0, matchedCount:0, result:null };
  ui.tab = 'sfida';
  render(); scrollAppTop();
}
function tapMatch(key){
  const m = ui.match; if(!m || m.result) return;
  const tile = m.tiles.find(t => t.key === key);
  if(!tile || tile.done) return;
  if(m.sel === key){ m.sel = null; render(); return; }
  if(!m.sel){ m.sel = key; render(); return; }
  const first = m.tiles.find(t => t.key === m.sel);
  if(!first) { m.sel = key; render(); return; }
  if(first.pid === tile.pid && first.kind !== tile.kind){
    first.done = true; tile.done = true; m.sel = null; m.matchedCount++;
    addXP(10, 'coppia trovata');
    if(m.matchedCount >= m.pairs.length){
      m.result = { mistakes: m.mistakes };
      db.stats.challengeCount = (db.stats.challengeCount || 0) + 1;
      db.stats.matches = (db.stats.matches || 0) + 1;
      addXP(25, 'abbinamenti completati');
    }
    saveDB(); render();
  } else {
    m.mistakes++; m.wrong = key; m.sel = null; render();
    setTimeout(() => { if(ui.match){ ui.match.wrong = null; render(); } }, 620);
  }
}
function viewMatch(){
  const m = ui.match;
  if(!m) return '';
  if(m.result){
    return `<div class="hero" style="text-align:center;padding:26px">
      <div style="font-size:44px">🧩</div>
      <div class="h1" style="margin-top:8px">${m.pairs.length} coppie</div>
      <div class="sm mut">completate con ${m.mistakes} error${m.mistakes === 1 ? 'e' : 'i'}</div>
    </div>
    <div class="grid2">
      <button class="btn soft" data-act="matchStart" data-n="4">🔁 Ancora</button>
      <button class="btn" data-act="matchExit">Torna alle sfide</button>
    </div>`;
  }
  return `
  <div class="row between" style="margin:2px 0 12px">
    <button class="btn ghost xs" data-act="matchExit">✕ Esci</button>
    <div class="row" style="gap:7px">
      <span class="pill ${m.mistakes ? 'warn' : ''}">errori: ${m.mistakes}</span>
      <span class="pill acc">${m.matchedCount}/${m.pairs.length}</span>
    </div>
  </div>
  <div class="tiny mut" style="margin:0 2px 12px">Tocca un termine e poi la sua descrizione.</div>
  ${m.tiles.map(t => `
    <button class="qopt ${t.done ? 'right' : ''} ${m.sel === t.key ? 'mark-sel' : ''} ${m.wrong === t.key ? 'wrong' : ''}"
      data-act="matchTap" data-key="${t.key}" ${t.done ? 'disabled' : ''}
      style="${t.done ? 'opacity:.55' : ''};${t.kind === 'term' ? 'font-weight:700' : 'font-weight:500'}">
      <span class="k">${t.done ? '✓' : (t.kind === 'term' ? 'A' : 'B')}</span>
      <span class="grow">${esc(t.text)}</span>
    </button>`).join('')}`;
}

function sendChatFromUI(){
  const inp = document.getElementById('chatIn');
  if(!inp) return;
  const q = inp.value.trim();
  if(!q) return;
  inp.value = '';
  askTutor(q);
}

/* =========================================================================
   EVENTI & AVVIO
   ========================================================================= */
document.addEventListener('click', e => {
  const tb = e.target.closest('.tabbar .tab');
  if(tb){ ui.tab = tb.dataset.tab; ui.quiz = null; ui.review = null; ui.session = null; ui.match = null; render(); scrollAppTop(); return; }
  const el = e.target.closest('[data-act]');
  if(!el) return;
  e.preventDefault();
  handleAct(el.dataset.act, { ...el.dataset }, el);
});

document.addEventListener('keydown', e => {
  if(e.target && e.target.id === 'chatIn' && e.key === 'Enter' && !e.shiftKey){
    e.preventDefault(); sendChatFromUI();
  }
});

document.addEventListener('input', e => {
  if(e.target && e.target.id === 'openAnswer' && ui.quiz){ ui.quiz.openText = e.target.value; return; }
  if(e.target && e.target.id === 'deckQ' && ui.deck){
    const v = e.target.value.toLowerCase();
    document.querySelectorAll('[data-act="editCard"]').forEach(el => {
      const item = el.closest('.item');
      if(item) item.style.display = el.textContent.toLowerCase().includes(v) ? '' : 'none';
    });
    return;
  }
  if(e.target && e.target.id === 'resQ'){
    const v = e.target.value.toLowerCase();
    document.querySelectorAll('[data-res-topic]').forEach(el => {
      el.style.display = el.dataset.resTopic.toLowerCase().includes(v) ? '' : 'none';
    });
    return;
  }
  if(ui.sheet && (e.target.id === 'pasteText' || e.target.id === 'pasteName' || e.target.id === 'feyText' || e.target.id === 'feyTopic')){
    ui.sheet[e.target.id === 'pasteText' || e.target.id === 'feyText' ? 'text' : 'name'] = e.target.value;
  }
});

/* drag & drop sul desktop */
document.addEventListener('dragover', e => { e.preventDefault(); });
document.addEventListener('drop', e => {
  e.preventDefault();
  if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) handleFiles([...e.dataTransfer.files]);
});


/* ---- iOS: avviso "Aggiungi a Home" (iOS non ha prompt automatico) ---- */
function maybeShowIosHint(){
  try{
    const ua = navigator.userAgent || '';
    const isIOS = /iphone|ipad|ipod/i.test(ua);
    const standalone = (navigator.standalone === true) ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if(!isIOS || standalone) return;
    try{ if(localStorage.getItem('studiaai.iosHint') === 'off') return; }catch(e){}
    if(document.getElementById('iosHint')) return;
    const el = document.createElement('div');
    el.id = 'iosHint';
    el.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:150;' +
      'background:rgba(24,28,40,.97);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:12px 14px;' +
      'box-shadow:0 18px 40px -16px #000;display:flex;gap:10px;align-items:flex-start';
    const txt = document.createElement('div');
    txt.style.cssText = 'flex:1;font-size:12.5px;line-height:1.5;color:#E9EBF2';
    txt.innerHTML = '<b>Installa su iPhone:</b> tocca <b style="color:#A5A9FF">Condividi ⤴</b> in basso e poi <b>“Aggiungi a Home”</b>. Si apre a schermo intero come un\'app.';
    const btn = document.createElement('button');
    btn.textContent = '✕';
    btn.style.cssText = 'background:none;border:0;color:#8A93A8;font-size:15px;line-height:1;padding:2px 4px;cursor:pointer';
    btn.addEventListener('click', function(){
      el.remove();
      try{ localStorage.setItem('studiaai.iosHint','off'); }catch(e){}
    });
    el.appendChild(txt); el.appendChild(btn);
    document.body.appendChild(el);
  }catch(e){}
}

ensureFileInput();
if(!db.subjects.length && !db.seed){ /* resta l'onboarding */ }
render();
maybeShowIosHint();
